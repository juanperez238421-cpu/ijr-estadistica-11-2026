<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assessment Operations · Statistics 11</title><link rel="stylesheet" href="../styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main class="shell"><header class="topbar"><div><div class="eyebrow">Instituto Jorge Robledo · Teacher only</div><h1>Assessment Operations</h1></div><a href="../" class="primary" style="text-decoration:none">Vista estudiante</a></header>
<section id="loginPanel" class="panel"><h2>Ingreso docente</h2><form id="loginForm" class="form-grid"><label>Email<input id="email" type="email" required></label><label>Contraseña<input id="password" type="password" required></label><button class="primary" type="submit">Ingresar</button></form><p id="loginStatus" class="status"></p></section>
<section id="dashboard" class="panel hidden"><div class="exam-meta"><span id="assessmentTitle">Assessment</span><button id="logout" class="primary">Salir</button></div><div class="summary" id="metrics"></div><div class="button-row" style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0"><button id="refresh" class="primary">Actualizar</button><button id="exportAttempts" class="primary">Exportar intentos CSV</button><button id="exportEvents" class="primary">Exportar eventos CSV</button></div><h2>Intentos</h2><div style="overflow:auto"><table id="attemptTable" style="width:100%;border-collapse:collapse"><thead><tr><th>Estudiante</th><th>Grupo</th><th>Estado</th><th>Progreso</th><th>Puntaje</th><th>Nota</th><th>Alertas</th><th>Última actividad</th></tr></thead><tbody></tbody></table></div><h2>Detalle / Timeline</h2><div id="detail" class="small">Selecciona un intento para revisar respuestas y eventos.</div></section></main><script src="../config.js"></script><script src="app.js"></script></body></html>
