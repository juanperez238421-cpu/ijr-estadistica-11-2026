name: Deploy Statistics 11 Assessment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate optional repository configuration
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_URL:-}" ] || [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
              echo "Set both SUPABASE_URL and SUPABASE_ANON_KEY, or neither."
              exit 1
            fi
            case "$SUPABASE_URL" in
              https://*.supabase.co) ;;
              *) echo "SUPABASE_URL must be an https://*.supabase.co URL"; exit 1;;
            esac
            if [ ${#SUPABASE_ANON_KEY} -lt 40 ]; then echo "SUPABASE_ANON_KEY appears invalid"; exit 1; fi
          else
            echo "Repository variables not set; using committed public Supabase URL/publishable key."
          fi

      - name: Inject public Supabase configuration when variables exist
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('evaluacion-conteo-permutaciones/config.js')
          config = {
              'assessmentSlug':'statistics11-counting-permutations-2026',
              'supabaseUrl':os.environ['SUPABASE_URL'].rstrip('/'),
              'supabaseAnonKey':os.environ['SUPABASE_ANON_KEY'],
              'durationMinutes':40,
              'questionsPerAttempt':18,
              'maxRawPoints':15,
              'gradeMin':3.0,
              'gradeMax':5.0,
              'passingGrade':3.0,
              'tabStrikeLimit':3,
              'hiddenGraceMs':1000,
              'integrityDebounceMs':1600,
              'heartbeatMs':10000,
              'requireFullscreen':True,
              'fullscreenPolicy':'pause',
              'fullscreenExitCountsAsStrike':True,
              'screenshotKeyCountsAsStrike':True,
              'duplicateTabCountsAsStrike':True,
              'blockCopyPaste':True,
              'blockContextMenu':True,
              'watermarkEnabled':True,
              'requireStudentEmail':True,
              'globallyDisjointQuestions':True,
              'studentSessionStorageKey':'ijr-stat11-counting-permutations-active-v2',
              'reportEmail':'juanperez238421@gmail.com',
              'rpc':{'start':'student_start_attempt_v2','resume':'student_resume_attempt','submit':'student_submit_answer','event':'student_log_event','finish':'student_finish_attempt'},
              'teacherRpc':{'login':'teacher_code_login','logout':'teacher_code_logout','snapshot':'teacher_dashboard_snapshot','detail':'teacher_attempt_detail','action':'teacher_code_action','startTest':'teacher_start_smoke_test','setEmail':'teacher_set_report_email'}
          }
          path.write_text('window.IJR_ASSESSMENT_CONFIG = Object.freeze(' + json.dumps(config, ensure_ascii=False, separators=(',',':')) + ');\n', encoding='utf-8')
          PY

      - name: Verify application syntax
        run: |
          set -euo pipefail
          node --check evaluacion-conteo-permutaciones/app.js
          node --check evaluacion-conteo-permutaciones/teacher-demo-bank.js
          node --check evaluacion-conteo-permutaciones/teacher-mode.js
          node --check actividad-colab-01/app.js
          node --check actividad-colab-01/config.js
          node --check maestro/app.js
          node --check maestro/config.js
          python -m py_compile tools/check_backend_readiness.py tools/import_academic_source.py tools/open_assessment.py

      - name: Verify static assessment files
        run: |
          set -euo pipefail
          test -s index.html
          test -s evaluacion-conteo-permutaciones/index.html
          test -s evaluacion-conteo-permutaciones/app.js
          test -s evaluacion-conteo-permutaciones/teacher-demo-bank.js
          test -s evaluacion-conteo-permutaciones/teacher-mode.js
          test -s evaluacion-conteo-permutaciones/config.js
          test -s evaluacion-conteo-permutaciones/teacher/index.html
          test -s actividad-colab-01/index.html
          test -s actividad-colab-01/app.js
          test -s actividad-colab-01/config.js
          test -s actividad-colab-01/colab_01_fundamentos.ipynb
          test -s actividad-colab-01/data.csv
          test -s maestro/index.html
          test -s maestro/app.js
          test -s maestro/config.js
          ! grep -R "REPLACE_WITH_SUPABASE" evaluacion-conteo-permutaciones/config.js
          grep -q "student_start_attempt_v2" evaluacion-conteo-permutaciones/config.js
          grep -q "teacher_code_login" evaluacion-conteo-permutaciones/config.js
          grep -Eq "gradeMin['\"]?:?3(\.0)?|gradeMin.*3\.0" evaluacion-conteo-permutaciones/config.js
          grep -q "studentEmail" evaluacion-conteo-permutaciones/index.html
          grep -q "student_learning_activity_start" actividad-colab-01/config.js
          grep -q "student_learning_activity_event" actividad-colab-01/config.js
          grep -q "teacher_learning_dashboard" maestro/config.js
          touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report:
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Report Pages deployment status to issue
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            icon="✅ PAGES READY"
          else
            icon="❌ PAGES FAILED"
          fi
          gh issue comment 33 \
            --repo juanperez238421-cpu/ijr-estadistica-11-2026 \
            --body "$icon · build=$BUILD_RESULT · deploy=$DEPLOY_RESULT · run $RUN_ID · commit $SHA · $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
