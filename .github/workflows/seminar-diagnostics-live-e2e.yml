name: Seminar Diagnostics Live E2E

on:
  pull_request:
    paths:
      - 'seminario/**'
      - 'seminario-tracks/**'
      - 'qa/seminar-diagnostics-live-e2e.mjs'
      - '.github/workflows/seminar-diagnostics-live-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start PR source on backend-allowed localhost origin
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/seminar-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8000/seminario/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/seminar-http.log
          exit 1
      - name: Run all five diagnostic start flows against PR source
        env:
          SEMINAR_BASE_URL: http://127.0.0.1:8000
        run: node qa/seminar-diagnostics-live-e2e.mjs
