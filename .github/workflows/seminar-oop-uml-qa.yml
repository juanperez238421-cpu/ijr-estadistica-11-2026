name: Seminar OOP UML Hub QA

on:
  push:
    branches: [main]
    paths:
      - "seminario-oop-uml/**"
      - "supabase/migrations/20260831150803_seminar_oop_uml_runtime_evidence_v2.sql"
      - "supabase/migrations/20260831161500_seminar_oop_uml_stage1_foundations_v3.sql"
      - "supabase/migrations/20260831163247_seminar_oop_uml_deep_stage1_v4.sql"
      - ".github/workflows/seminar-oop-uml-qa.yml"
  pull_request:
    paths:
      - "seminario-oop-uml/**"
      - "supabase/migrations/20260831150803_seminar_oop_uml_runtime_evidence_v2.sql"
      - "supabase/migrations/20260831161500_seminar_oop_uml_stage1_foundations_v3.sql"
      - "supabase/migrations/20260831163247_seminar_oop_uml_deep_stage1_v4.sql"
      - ".github/workflows/seminar-oop-uml-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required student routes
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            seminario-oop-uml/index.html \
            seminario-oop-uml/theory.html \
            seminario-oop-uml/workshop.html \
            seminario-oop-uml/styles.css \
            seminario-oop-uml/coding-runtime-v2.css \
            seminario-oop-uml/coding-labs-v2.js \
            seminario-oop-uml/stage1-foundations-v3.js \
            seminario-oop-uml/stage1-uml-depth-v4.js \
            seminario-oop-uml/coding-runtime-v2.js \
            seminario-oop-uml/config.js \
            seminario-oop-uml/course-data.js \
            seminario-oop-uml/store.js \
            seminario-oop-uml/hub.js \
            seminario-oop-uml/workshop.js; do
            test -s "$f"
          done

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check seminario-oop-uml/config.js
          node --check seminario-oop-uml/course-data.js
          node --check seminario-oop-uml/store.js
          node --check seminario-oop-uml/hub.js
          node --check seminario-oop-uml/workshop.js
          node --check seminario-oop-uml/coding-labs-v2.js
          node --check seminario-oop-uml/stage1-foundations-v3.js
          node --check seminario-oop-uml/stage1-uml-depth-v4.js
          node --check seminario-oop-uml/coding-runtime-v2.js
          python - <<'PY'
          import pathlib, re
          text=pathlib.Path('seminario-oop-uml/theory.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',text,re.S|re.I)
          if not blocks:
              raise SystemExit('No inline theory script found')
          pathlib.Path('/tmp/theory-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/theory-inline.js

      - name: Validate ten-session curriculum contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -o "sessionKey:'s[0-9][0-9]'" seminario-oop-uml/course-data.js | wc -l | tr -d ' ')" = "10"
          for key in s01 s02 s03 s04 s05 s06 s07 s08 s09 s10; do
            grep -q "sessionKey:'$key'" seminario-oop-uml/course-data.js
          done
          grep -q "Class · Object · Instance" seminario-oop-uml/course-data.js
          grep -q "Encapsulation & Visibility" seminario-oop-uml/course-data.js
          grep -q "Object Relationships" seminario-oop-uml/course-data.js
          grep -q "Inheritance & Generalization" seminario-oop-uml/course-data.js
          grep -q "Polymorphism & Abstraction" seminario-oop-uml/course-data.js
          grep -q "UML Class Diagram Architecture" seminario-oop-uml/course-data.js
          grep -q "Architecture Defense" seminario-oop-uml/course-data.js

      - name: Validate beginner Session 01 foundations
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Start with the idea, not the syntax" seminario-oop-uml/stage1-foundations-v3.js
          grep -q "class, object, attribute and method" seminario-oop-uml/stage1-foundations-v3.js
          grep -q "CLASS Sensor" seminario-oop-uml/stage1-foundations-v3.js
          grep -q "JavaScript" seminario-oop-uml/stage1-foundations-v3.js
          grep -q "C#" seminario-oop-uml/stage1-foundations-v3.js
          grep -q "foundationPanel" seminario-oop-uml/theory.html
          node - <<'NODE'
          global.window={};
          require('./seminario-oop-uml/course-data.js');
          require('./seminario-oop-uml/coding-labs-v2.js');
          require('./seminario-oop-uml/stage1-foundations-v3.js');
          const topic=window.IJR_OOP_UML_DATA.topics.find(x=>x.n===1);
          const lab=window.IJR_OOP_CODING_LABS[1];
          if(!topic||topic.concepts.length<6) throw new Error('Session 01 needs beginner concept depth');
          if(topic.uml.name!=='Book') throw new Error('Session 01 reference model must be beginner-readable');
          if(lab.theory.length!==2||lab.workshop.length!==3) throw new Error('Session 01 notebook contract changed');
          if(!lab.workshop[0].steps.join(' ').includes('Choose any concept')) throw new Error('Workshop must begin from a student-selected concept');
          console.log('Session 01 foundation model verified');
          NODE

      - name: Validate deep UML Stage 01 contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Unified Modeling Language" seminario-oop-uml/stage1-uml-depth-v4.js
          grep -q "ACTUAL UML CLASS BOX STRUCTURE" seminario-oop-uml/stage1-uml-depth-v4.js
          grep -q "TOP COMPARTMENT · CLASS NAME" seminario-oop-uml/stage1-uml-depth-v4.js
          grep -q "MIDDLE COMPARTMENT · ATTRIBUTES" seminario-oop-uml/stage1-uml-depth-v4.js
          grep -q "BOTTOM COMPARTMENT · METHODS / OPERATIONS" seminario-oop-uml/stage1-uml-depth-v4.js
          grep -q "DEEP CONSTRUCTION PROCEDURE" seminario-oop-uml/stage1-uml-depth-v4.js
          grep -q "UML IDENTIFICATION LAB" seminario-oop-uml/stage1-uml-depth-v4.js
          grep -q "stage1-uml-depth-v4.js?v=20260831-v4" seminario-oop-uml/theory.html
          grep -q "stage1-uml-depth-v4.js?v=20260831-v4" seminario-oop-uml/workshop.html
          grep -q "pedagogy_version:'oop-uml-v4'" seminario-oop-uml/workshop.js
          grep -q "uml_mastery" seminario-oop-uml/workshop.js
          node - <<'NODE'
          global.window={};
          require('./seminario-oop-uml/course-data.js');
          require('./seminario-oop-uml/coding-labs-v2.js');
          require('./seminario-oop-uml/stage1-foundations-v3.js');
          require('./seminario-oop-uml/stage1-uml-depth-v4.js');
          const model=window.IJR_OOP_UML_STAGE1_UML;
          const topic=window.IJR_OOP_UML_DATA.topics.find(x=>x.n===1);
          if(model?.version!=='oop-uml-v4') throw new Error('Missing UML v4 model');
          if(model.guide.constructionSteps.length<10) throw new Error('Need deep step-by-step UML construction');
          if(model.cases.length<6) throw new Error('Need at least six conceptual class cases');
          for(const item of model.cases){
            const kinds=new Set(item.members.map(x=>x[1]));
            for(const required of ['class','attribute','method','object','not-member']){
              if(!kinds.has(required)) throw new Error(`${item.id} missing ${required}`);
            }
            if(item.members.length<8) throw new Error(`${item.id} classification set too small`);
          }
          if(topic.concepts.length<7) throw new Error('Stage 01 UML conceptual depth too small');
          if(!topic.evidence.join(' ').includes('class / attribute / method / object / non-member')) throw new Error('Objective UML classification evidence missing');
          console.log('UML v4 deep theory + six-case identification contract verified');
          NODE

      - name: Validate guided notebook catalog
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          global.window={};
          require('./seminario-oop-uml/course-data.js');
          require('./seminario-oop-uml/coding-labs-v2.js');
          require('./seminario-oop-uml/stage1-foundations-v3.js');
          require('./seminario-oop-uml/stage1-uml-depth-v4.js');
          const labs=window.IJR_OOP_CODING_LABS;
          const keys=Object.keys(labs||{});
          if(keys.length!==10) throw new Error(`Expected 10 coding labs, found ${keys.length}`);
          for(let n=1;n<=10;n++){
            if(!labs[n]) throw new Error(`Missing coding lab ${n}`);
            if(labs[n].theory.length!==2) throw new Error(`Theory ${n} must have 2 guided cells`);
            if(labs[n].workshop.length!==3) throw new Error(`Workshop ${n} must have 3 guided cells`);
            for(const item of [...labs[n].theory,...labs[n].workshop]){
              if(!item.id||!item.title||!item.purpose||!Array.isArray(item.steps)||item.steps.length<3) throw new Error(`Incomplete cell in session ${n}`);
            }
          }
          console.log('10 sessions · 20 theory cells · 30 workshop cells');
          NODE

      - name: Validate executable runtime contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "pyodide/v0.27.7/full/pyodide.js" seminario-oop-uml/theory.html
          grep -q "pyodide/v0.27.7/full/pyodide.js" seminario-oop-uml/workshop.html
          grep -q "runPythonAsync" seminario-oop-uml/coding-runtime-v2.js
          grep -q "setStdout" seminario-oop-uml/coding-runtime-v2.js
          grep -q "setStderr" seminario-oop-uml/coding-runtime-v2.js
          grep -q "oopTerminalInput" seminario-oop-uml/coding-runtime-v2.js
          grep -q "code_snapshot" seminario-oop-uml/coding-runtime-v2.js
          grep -q "theoryCodingLab" seminario-oop-uml/theory.html
          grep -q "workshopCodingLab" seminario-oop-uml/workshop.html
          grep -q "ijr-oop-cell-run" seminario-oop-uml/workshop.js

      - name: Validate Supabase progress contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "sb_publishable_" seminario-oop-uml/config.js
          grep -q "seminar_course_start_team" seminario-oop-uml/config.js
          grep -q "seminar_course_resume" seminario-oop-uml/config.js
          grep -q "seminar_oop_uml_snapshot" seminario-oop-uml/config.js
          grep -q "seminar_oop_uml_record_session" seminario-oop-uml/config.js
          grep -q "p_attempt_token" seminario-oop-uml/store.js
          grep -q "recordSession" seminario-oop-uml/workshop.js
          grep -q "code_snapshot" supabase/migrations/20260831150803_seminar_oop_uml_runtime_evidence_v2.sql
          grep -q "successful_run_count" supabase/migrations/20260831150803_seminar_oop_uml_runtime_evidence_v2.sql
          grep -q "pedagogy_version" supabase/migrations/20260831161500_seminar_oop_uml_stage1_foundations_v3.sql
          grep -q "learning_focus" supabase/migrations/20260831161500_seminar_oop_uml_stage1_foundations_v3.sql
          grep -q "uml_classification_score" supabase/migrations/20260831163247_seminar_oop_uml_deep_stage1_v4.sql
          grep -q "uml_draft_class" supabase/migrations/20260831163247_seminar_oop_uml_deep_stage1_v4.sql
          grep -q "Complete the Stage 01 UML identification challenge" supabase/migrations/20260831163247_seminar_oop_uml_deep_stage1_v4.sql
          ! grep -Rqi "service_role\|SUPABASE_SERVICE_ROLE\|secret_key" seminario-oop-uml

      - name: Validate pedagogy and route integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Model first. Code second." seminario-oop-uml/index.html
          grep -q "Theory" seminario-oop-uml/index.html
          grep -q "Workshop" seminario-oop-uml/index.html
          grep -q "evModel" seminario-oop-uml/workshop.html
          grep -q "evCode" seminario-oop-uml/workshop.html
          grep -q "evTest" seminario-oop-uml/workshop.html
          grep -q "evExplain" seminario-oop-uml/workshop.html
          grep -q "seminario-oop-colab-01" seminario-oop-uml/workshop.html
