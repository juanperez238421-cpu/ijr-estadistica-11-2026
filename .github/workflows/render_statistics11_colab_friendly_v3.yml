name: Render Statistics 11 Friendly Colab PQH

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout temporary render branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate exact Python source
        shell: bash
        run: |
          set -euo pipefail
          cat manim_render_jobs/statistics11_colab_friendly_v3/source_part_*.b64 \
            | base64 -d \
            | gzip -dc \
            > statistics11_colab_friendly_introduction_v3.py

          test -s statistics11_colab_friendly_introduction_v3.py
          echo "995032512e6502d38453fc5fd4230518ced95b7094aef900daf85008f39bd5fc  statistics11_colab_friendly_introduction_v3.py" \
            | sha256sum -c -
          python -m py_compile statistics11_colab_friendly_introduction_v3.py
          grep -q '^class Statistics11ColabFriendlyIntroduction(MovingCameraScene)' statistics11_colab_friendly_introduction_v3.py || \
            grep -q '^class Statistics11ColabFriendlyIntroduction(Statistics11ColabProbabilityMasterclassFinal)' statistics11_colab_friendly_introduction_v3.py
          grep -q '^class Statistics11ColabFriendlyIntroductionPreview' statistics11_colab_friendly_introduction_v3.py

      - name: Pull fixed ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Mandatory preview render with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=1 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql statistics11_colab_friendly_introduction_v3.py \
                Statistics11ColabFriendlyIntroductionPreview \
                --format=mp4 --disable_caching
            ' 2>&1 | tee preview_render.log

      - name: Complete low-quality class validation with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=1 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql statistics11_colab_friendly_introduction_v3.py \
                Statistics11ColabFriendlyIntroduction \
                --format=mp4 --disable_caching
            ' 2>&1 | tee complete_pql_render.log

      - name: Final full-duration render with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=0 \
            -e STATS11_COLAB_SHOW_SOLUTIONS=0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pqh statistics11_colab_friendly_introduction_v3.py \
                Statistics11ColabFriendlyIntroduction \
                --format=mp4 --disable_caching
            ' 2>&1 | tee final_pqh_render.log

      - name: Verify, decode, inspect frames, and stage delivery
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find media -type f -path '*/1080p30/*' -name 'Statistics11ColabFriendlyIntroduction.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO"
          test -s "$VIDEO"

          mkdir -p delivery/control_frames
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO" | tee delivery/FFPROBE.txt

          grep -q '^codec_name=h264$' delivery/FFPROBE.txt
          grep -q '^width=1920$' delivery/FFPROBE.txt
          grep -q '^height=1080$' delivery/FFPROBE.txt
          grep -q '^r_frame_rate=30/1$' delivery/FFPROBE.txt
          grep -q '^pix_fmt=yuv420p$' delivery/FFPROBE.txt

          ffmpeg -v error -i "$VIDEO" -f null -
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          MID="$(python - <<PY
          d=float('$DURATION')
          print(max(1.0, d/2.0))
          PY
          )"
          ffmpeg -y -v error -ss 5 -i "$VIDEO" -frames:v 1 delivery/control_frames/frame_start.png
          ffmpeg -y -v error -ss "$MID" -i "$VIDEO" -frames:v 1 delivery/control_frames/frame_middle.png
          ffmpeg -y -v error -sseof -5 -i "$VIDEO" -frames:v 1 delivery/control_frames/frame_end.png
          test -s delivery/control_frames/frame_start.png
          test -s delivery/control_frames/frame_middle.png
          test -s delivery/control_frames/frame_end.png

          cp "$VIDEO" delivery/Statistics11ColabFriendlyIntroduction_pqh.mp4
          cp statistics11_colab_friendly_introduction_v3.py delivery/
          cp preview_render.log complete_pql_render.log final_pqh_render.log delivery/
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Statistics11ColabFriendlyIntroduction
          Source: statistics11_colab_friendly_introduction_v3.py
          ManimCE: 0.20.1
          Final command: manim -pqh statistics11_colab_friendly_introduction_v3.py Statistics11ColabFriendlyIntroduction --format=mp4 --disable_caching
          Resolution target: 1920x1080
          FPS target: 30
          Student edition: guided-practice solution hidden
          EOF
          sha256sum delivery/Statistics11ColabFriendlyIntroduction_pqh.mp4 \
            delivery/statistics11_colab_friendly_introduction_v3.py \
            > delivery/SHA256SUMS.txt
          ls -lah delivery delivery/control_frames

      - name: Upload verified final delivery
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11ColabFriendlyIntroduction_pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11ColabFriendlyIntroduction_failure_diagnostics
          path: |
            statistics11_colab_friendly_introduction_v3.py
            preview_render.log
            complete_pql_render.log
            final_pqh_render.log
            media/
          if-no-files-found: ignore
          retention-days: 2
