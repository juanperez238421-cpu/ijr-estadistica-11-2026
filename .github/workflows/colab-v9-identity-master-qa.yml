name: Statistics 11 Colab Class 01 V11 QA

on:
  pull_request:
    paths:
      - 'actividad-colab-01/**'
      - 'maestro/**'
      - 'supabase/migrations/**'
      - 'qa/check_colab_class1_v10.py'
      - '.github/workflows/colab-v9-identity-master-qa.yml'
  push:
    branches: [main]
    paths:
      - 'actividad-colab-01/**'
      - 'maestro/**'
      - 'supabase/migrations/**'
      - 'qa/check_colab_class1_v10.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  class1-v11-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check actividad-colab-01/config.js
          node --check actividad-colab-01/resilience-v7.js
          node --check actividad-colab-01/sw-v7.js
          node --check actividad-colab-01/app.js
          node --check maestro/config.js
          node --check maestro/app.js
      - name: Class 01 V11 randomized bank, identity and master controls
        run: |
          set -euo pipefail
          python -m py_compile qa/check_colab_class1_v10.py
          python qa/check_colab_class1_v10.py
