name: Statistics 11 Colab V9 Identity Master QA

on:
  pull_request:
    paths:
      - 'actividad-colab-01/**'
      - 'maestro/**'
      - 'supabase/migrations/**'
      - 'qa/check_colab_v9_identity_master.py'
      - '.github/workflows/colab-v9-identity-master-qa.yml'
  push:
    branches: [main]
    paths:
      - 'actividad-colab-01/**'
      - 'maestro/**'
      - 'supabase/migrations/**'
      - 'qa/check_colab_v9_identity_master.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-master-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check actividad-colab-01/config.js
          node --check actividad-colab-01/resilience-v7.js
          node --check actividad-colab-01/app.js
          node --check maestro/config.js
          node --check maestro/app.js
      - name: Institutional identity and minimal master contract
        run: |
          set -euo pipefail
          python -m py_compile qa/check_colab_v9_identity_master.py
          python qa/check_colab_v9_identity_master.py
