name: Render Grade 11 Colab V2 and Interface Explainer

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout isolated render branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate all learning files
        shell: bash
        run: |
          set -euo pipefail
          BASE="render_jobs/statistics11_colab_data_foundations"
          WORK="render_jobs/statistics11_colab_v2_interface"

          cat "$BASE"/final_source_part_*.b64 | base64 -d | gzip -dc > "$WORK/statistics11_colab_data_analysis_foundations.py"
          cat "$BASE"/dataset_part_*.b64 | base64 -d | gzip -dc > "$WORK/grade11_colab_student_success.csv"
          cat "$BASE"/dictionary_part_*.b64 | base64 -d | gzip -dc > "$WORK/grade11_colab_student_success_data_dictionary.csv"
          cat "$BASE"/notebook_part_*.b64 | base64 -d | gzip -dc > "$WORK/grade11_colab_data_analysis_foundations.ipynb"

          cat "$WORK"/v2_source_part_*.b64 | base64 -d | gzip -dc > "$WORK/statistics11_colab_data_analysis_foundations_v2.py"
          cat "$WORK"/interface_source_part_*.b64 | base64 -d | gzip -dc > "$WORK/grade11_colab_interface_explainer.py"
          cat "$WORK"/interface_notebook_part_*.b64 | base64 -d | gzip -dc > "$WORK/grade11_colab_interface_walkthrough.ipynb"

          cp materials/colab_interface/COLAB_INTERFACE_QUICK_REFERENCE.md "$WORK/"
          cp materials/colab_interface/COLAB_INTERFACE_TEACHER_GUIDE.md "$WORK/"
          cp materials/colab_interface/README.md "$WORK/COLAB_INTERFACE_PACKAGE_README.md"
          cp materials/colab_data_foundations_v2/REVIEW_CURRENT_COLAB_DATA_FOUNDATIONS.md "$WORK/"
          cp materials/colab_data_foundations_v2/README.md "$WORK/V2_RENDER_README.md"

          cd "$WORK"
          python -m py_compile \
            statistics11_colab_data_analysis_foundations.py \
            statistics11_colab_data_analysis_foundations_v2.py \
            grade11_colab_interface_explainer.py

          echo "5828a630f0629b6177ffadda3fe3b45f2698c74bf2edb18c368646984b8599fc  statistics11_colab_data_analysis_foundations.py" | sha256sum -c -
          echo "1d0418d29dd9104a6e6789b57077b6a0d5acb042e109eca0b0d15353a99cf1ab  statistics11_colab_data_analysis_foundations_v2.py" | sha256sum -c -
          echo "4df5b9c85907215e5ec9937ff470159a86b2d61745116c58c2ba0060e0808446  grade11_colab_interface_explainer.py" | sha256sum -c -
          echo "9e290045435cefb82e798234eb19ceb120788ca49a70b8f9e7eaa3ad74a5497c  grade11_colab_student_success.csv" | sha256sum -c -
          echo "573d074459da8cde33e79ff9475cca3304daa73fbbf25749190c119b9c426cc6  grade11_colab_student_success_data_dictionary.csv" | sha256sum -c -
          echo "8b8278adca16ef249f04c49309ec2a252e5868ab34159ab6be2ad3280d455dd9  grade11_colab_data_analysis_foundations.ipynb" | sha256sum -c -
          echo "42f7a081c3f927ac603eae9d03aeed7386cb239ec00799d72603058a73776653  grade11_colab_interface_walkthrough.ipynb" | sha256sum -c -

          python - <<'PY'
          import ast, csv, json
          from pathlib import Path

          for filename, required in {
              'statistics11_colab_data_analysis_foundations_v2.py': {
                  'Statistics11ColabDataAnalysisFoundationsV2',
                  'Statistics11ColabDataAnalysisFoundationsV2Preview',
              },
              'grade11_colab_interface_explainer.py': {
                  'Grade11ColabInterfaceExplainer',
                  'Grade11ColabInterfaceExplainerPreview',
              },
          }.items():
              tree = ast.parse(Path(filename).read_text(encoding='utf-8'))
              classes = {node.name for node in tree.body if isinstance(node, ast.ClassDef)}
              assert required <= classes, (filename, required - classes)

          with open('grade11_colab_student_success.csv', newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 72 and len(rows[0]) == 13

          main_nb = json.loads(Path('grade11_colab_data_analysis_foundations.ipynb').read_text(encoding='utf-8'))
          interface_nb = json.loads(Path('grade11_colab_interface_walkthrough.ipynb').read_text(encoding='utf-8'))
          assert main_nb['nbformat'] == 4 and len(main_nb['cells']) >= 20
          assert interface_nb['nbformat'] == 4 and len(interface_nb['cells']) >= 15
          print('Source, curriculum files, and notebooks: PASS')
          PY

      - name: Pull fixed ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Mandatory V2 layout preview with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/statistics11_colab_v2_interface
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e STATS11_FOUNDATIONS_SHORT_PAUSES=1 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql statistics11_colab_data_analysis_foundations_v2.py \
                Statistics11ColabDataAnalysisFoundationsV2Preview \
                --format=mp4 --disable_caching
            ' 2>&1 | tee v2_preview_pql.log

      - name: Mandatory interface preview with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/statistics11_colab_v2_interface
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql grade11_colab_interface_explainer.py \
                Grade11ColabInterfaceExplainerPreview \
                --format=mp4 --disable_caching
            ' 2>&1 | tee interface_preview_pql.log

      - name: Complete V2 validation with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/statistics11_colab_v2_interface
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e STATS11_FOUNDATIONS_SHORT_PAUSES=1 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql statistics11_colab_data_analysis_foundations_v2.py \
                Statistics11ColabDataAnalysisFoundationsV2 \
                --format=mp4 --disable_caching
            ' 2>&1 | tee v2_complete_pql.log

      - name: Complete interface validation with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/statistics11_colab_v2_interface
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql grade11_colab_interface_explainer.py \
                Grade11ColabInterfaceExplainer \
                --format=mp4 --disable_caching
            ' 2>&1 | tee interface_complete_pql.log

      - name: Render both final videos with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/statistics11_colab_v2_interface
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e STATS11_FOUNDATIONS_SHORT_PAUSES=0 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pqh statistics11_colab_data_analysis_foundations_v2.py \
                Statistics11ColabDataAnalysisFoundationsV2 \
                --format=mp4 --disable_caching
              manim -pqh grade11_colab_interface_explainer.py \
                Grade11ColabInterfaceExplainer \
                --format=mp4 --disable_caching
            ' 2>&1 | tee final_pqh.log

      - name: Verify, decode, audit, and package both deliveries
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/statistics11_colab_v2_interface

          python - <<'PY'
          from pathlib import Path
          import json, subprocess, shutil, hashlib, zipfile

          root = Path.cwd()
          videos = list((root / 'media').rglob('*.mp4'))

          def find_scene(name: str) -> Path:
              matches = [p for p in videos if p.name == f'{name}.mp4' and '1080p30' in p.parts]
              if not matches:
                  raise FileNotFoundError(name)
              return max(matches, key=lambda p: p.stat().st_mtime)

          v2_video = find_scene('Statistics11ColabDataAnalysisFoundationsV2')
          interface_video = find_scene('Grade11ColabInterfaceExplainer')

          def probe(video: Path, min_duration: float) -> dict:
              data = json.loads(subprocess.check_output([
                  'ffprobe', '-v', 'error', '-show_streams', '-show_format', '-of', 'json', str(video)
              ], text=True))
              stream = next(s for s in data['streams'] if s.get('codec_type') == 'video')
              assert stream['codec_name'] == 'h264'
              assert int(stream['width']) == 1920 and int(stream['height']) == 1080
              assert stream['r_frame_rate'] == '30/1'
              assert stream['pix_fmt'] == 'yuv420p'
              assert float(data['format']['duration']) > min_duration
              assert int(data['format']['size']) > 1_000_000
              subprocess.run(['ffmpeg', '-v', 'error', '-i', str(video), '-f', 'null', '-'], check=True)
              return data

          v2_probe = probe(v2_video, 135.0)
          interface_probe = probe(interface_video, 95.0)

          delivery = root / 'delivery'
          delivery.mkdir(exist_ok=True)
          audit = delivery / 'control_frames'
          audit.mkdir(exist_ok=True)

          def extract_frames(video: Path, prefix: str, duration: float) -> None:
              times = list(range(8, int(duration), 15)) + [max(1.0, duration - 3)]
              for index, t in enumerate(times):
                  subprocess.run([
                      'ffmpeg', '-y', '-v', 'error', '-ss', f'{t:.3f}', '-i', str(video),
                      '-frames:v', '1', str(audit / f'{prefix}_{index:02d}_{t:.0f}s.png')
                  ], check=True)

          extract_frames(v2_video, 'v2', float(v2_probe['format']['duration']))
          extract_frames(interface_video, 'interface', float(interface_probe['format']['duration']))

          map_png = root / 'colab_interface_map.png'
          subprocess.run([
              'ffmpeg', '-y', '-v', 'error', '-ss', '18', '-i', str(interface_video),
              '-frames:v', '1', str(map_png)
          ], check=True)

          package_v2 = root / 'package_v2'
          package_interface = root / 'package_interface'
          package_v2.mkdir(exist_ok=True)
          package_interface.mkdir(exist_ok=True)

          v2_name = 'Statistics11ColabDataAnalysisFoundationsV2_pqh.mp4'
          interface_name = 'Grade11ColabInterfaceExplainer_pqh.mp4'
          shutil.copy2(v2_video, package_v2 / v2_name)
          shutil.copy2(interface_video, package_interface / interface_name)

          for filename in [
              'statistics11_colab_data_analysis_foundations.py',
              'statistics11_colab_data_analysis_foundations_v2.py',
              'grade11_colab_student_success.csv',
              'grade11_colab_student_success_data_dictionary.csv',
              'grade11_colab_data_analysis_foundations.ipynb',
              'REVIEW_CURRENT_COLAB_DATA_FOUNDATIONS.md',
              'V2_RENDER_README.md',
          ]:
              shutil.copy2(root / filename, package_v2 / filename)

          for filename in [
              'statistics11_colab_data_analysis_foundations.py',
              'grade11_colab_interface_explainer.py',
              'grade11_colab_interface_walkthrough.ipynb',
              'COLAB_INTERFACE_QUICK_REFERENCE.md',
              'COLAB_INTERFACE_TEACHER_GUIDE.md',
              'COLAB_INTERFACE_PACKAGE_README.md',
              'grade11_colab_student_success.csv',
              'grade11_colab_student_success_data_dictionary.csv',
          ]:
              shutil.copy2(root / filename, package_interface / filename)
          shutil.copy2(map_png, package_interface / 'colab_interface_map.png')

          (package_v2 / 'RENDER_INFO.txt').write_text(
              'Scene: Statistics11ColabDataAnalysisFoundationsV2\n'
              'ManimCE: 0.20.1\n'
              'Final command: manim -pqh statistics11_colab_data_analysis_foundations_v2.py Statistics11ColabDataAnalysisFoundationsV2 --format=mp4 --disable_caching\n'
              'Resolution: 1920x1080 at 30 fps\nLanguage: English\n', encoding='utf-8')
          (package_interface / 'RENDER_INFO.txt').write_text(
              'Scene: Grade11ColabInterfaceExplainer\n'
              'ManimCE: 0.20.1\n'
              'Final command: manim -pqh grade11_colab_interface_explainer.py Grade11ColabInterfaceExplainer --format=mp4 --disable_caching\n'
              'Resolution: 1920x1080 at 30 fps\nLanguage: English\n', encoding='utf-8')

          def write_hashes(folder: Path) -> None:
              lines = []
              for p in sorted(folder.iterdir()):
                  if p.is_file() and p.name != 'SHA256SUMS.txt':
                      lines.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")
              (folder / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          write_hashes(package_v2)
          write_hashes(package_interface)

          def make_zip(folder: Path, target: Path) -> None:
              with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for p in sorted(folder.rglob('*')):
                      if p.is_file():
                          zf.write(p, arcname=f'{folder.name}/{p.relative_to(folder)}')

          v2_zip = delivery / 'Grade11_Colab_Data_Analysis_Foundations_V2_Package.zip'
          interface_zip = delivery / 'Grade11_Colab_Interface_Explainer_Package.zip'
          make_zip(package_v2, v2_zip)
          make_zip(package_interface, interface_zip)

          shutil.copy2(package_v2 / v2_name, delivery / v2_name)
          shutil.copy2(package_interface / interface_name, delivery / interface_name)
          shutil.copy2(root / 'statistics11_colab_data_analysis_foundations_v2.py', delivery / 'statistics11_colab_data_analysis_foundations_v2.py')
          shutil.copy2(root / 'grade11_colab_interface_explainer.py', delivery / 'grade11_colab_interface_explainer.py')
          shutil.copy2(root / 'grade11_colab_interface_walkthrough.ipynb', delivery / 'grade11_colab_interface_walkthrough.ipynb')
          shutil.copy2(root / 'grade11_colab_student_success.csv', delivery / 'grade11_colab_student_success.csv')
          shutil.copy2(root / 'grade11_colab_student_success_data_dictionary.csv', delivery / 'grade11_colab_student_success_data_dictionary.csv')
          shutil.copy2(map_png, delivery / 'colab_interface_map.png')

          summary = {
              'v2_video': str(v2_video),
              'v2_duration': float(v2_probe['format']['duration']),
              'interface_video': str(interface_video),
              'interface_duration': float(interface_probe['format']['duration']),
          }
          (delivery / 'DELIVERY_SUMMARY.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          print(json.dumps(summary, indent=2))
          PY

          cp v2_preview_pql.log interface_preview_pql.log v2_complete_pql.log interface_complete_pql.log final_pqh.log delivery/

      - name: Upload verified V2 and interface packages
        uses: actions/upload-artifact@v4
        with:
          name: Grade11_Colab_V2_and_Interface_Packages
          path: render_jobs/statistics11_colab_v2_interface/delivery/
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Grade11_Colab_V2_Interface_failure
          path: |
            render_jobs/statistics11_colab_v2_interface/*.py
            render_jobs/statistics11_colab_v2_interface/*.ipynb
            render_jobs/statistics11_colab_v2_interface/*.csv
            render_jobs/statistics11_colab_v2_interface/*.md
            render_jobs/statistics11_colab_v2_interface/*.log
            render_jobs/statistics11_colab_v2_interface/media/
            render_jobs/statistics11_colab_v2_interface/delivery/
          if-no-files-found: ignore
          retention-days: 2
