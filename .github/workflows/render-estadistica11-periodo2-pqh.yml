name: Render Estadistica 11 Periodo 2 PQH

on:
  push:
    branches:
      - render/estadistica11-periodo2-pqh-20260805
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout render branch
        uses: actions/checkout@v4

      - name: Reconstruct exact render pipeline
        shell: bash
        run: |
          set -euo pipefail
          base64 -d render_source/render_stats11_pipeline.sh.gz.b64 | gzip -d > render_stats11_pipeline.sh
          echo "4d03e048d26f26e8bd58739922ec39b4990cd294996e629d3b41d9fcf8684c60  render_stats11_pipeline.sh" | sha256sum -c -
          chmod +x render_stats11_pipeline.sh

      - name: Validate, render PQL, render PQH and verify
        shell: bash
        run: ./render_stats11_pipeline.sh

      - name: Upload verified ManimCE PQH series
        uses: actions/upload-artifact@v4
        with:
          name: Estadistica11_Periodo2_ManimCE_PQH
          path: delivery/
          if-no-files-found: error
          retention-days: 7
