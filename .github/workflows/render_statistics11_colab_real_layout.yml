name: Render Statistics 11 Real Colab Layout

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout temporary render branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p render_workspace
          cat \
            manim_render_jobs/statistics11_colab_real_layout_20260727/payload_00.b64 \
            manim_render_jobs/statistics11_colab_real_layout_20260727/payload_01.b64 \
            manim_render_jobs/statistics11_colab_real_layout_20260727/payload_02.b64 \
            manim_render_jobs/statistics11_colab_real_layout_20260727/payload_03a.b64 \
            manim_render_jobs/statistics11_colab_real_layout_20260727/payload_03b.b64 \
            manim_render_jobs/statistics11_colab_real_layout_20260727/payload_03c.b64 \
            manim_render_jobs/statistics11_colab_real_layout_20260727/payload_03d.b64 \
            | base64 -d | gzip -dc > render_workspace/main.py
          sed -i 's/# 6 is the total number of die outcomes/# Total number of die outcomes/g' render_workspace/main.py
          python -m py_compile render_workspace/main.py
          test -s render_workspace/main.py
          ACTUAL_SHA="$(sha256sum render_workspace/main.py | awk '{print $1}')"
          EXPECTED_SHA="be08ddc263dbf72948d69bfa0202bcb58a9ab3d637b68f006ede27b77113518f"
          echo "source_sha256=$ACTUAL_SHA" | tee source_sha256.txt
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          grep -nE '^class Statistics11ColabPythonIntroduction' render_workspace/main.py

      - name: Pull official ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Mandatory full preview with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=1 \
            -e STATS11_COLAB_SHOW_SOLUTIONS=0 \
            -v "$PWD:/manim" \
            -w /manim/render_workspace \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c 'mkdir -p /tmp/colab-bin; printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open; chmod +x /tmp/colab-bin/xdg-open; export PATH="/tmp/colab-bin:$PATH"; manim -pql main.py Statistics11ColabPythonIntroduction --format=mp4 --disable_caching' \
            2>&1 | tee preview_render.log
          status=${PIPESTATUS[0]}
          set -e
          echo "preview_container_exit_status=$status" | tee preview_status.txt
          PREVIEW="$(find render_workspace/media -type f -name 'Statistics11ColabPythonIntroduction.mp4' -print -quit)"
          test -n "$PREVIEW"
          test -s "$PREVIEW"

      - name: Final render with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          rm -rf render_workspace/media
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=1 \
            -e STATS11_COLAB_SHOW_SOLUTIONS=0 \
            -v "$PWD:/manim" \
            -w /manim/render_workspace \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c 'mkdir -p /tmp/colab-bin; printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open; chmod +x /tmp/colab-bin/xdg-open; export PATH="/tmp/colab-bin:$PATH"; manim -pqh main.py Statistics11ColabPythonIntroduction --format=mp4 --disable_caching' \
            2>&1 | tee final_render.log
          status=${PIPESTATUS[0]}
          set -e
          echo "final_container_exit_status=$status" | tee final_status.txt
          VIDEO="$(find render_workspace/media -type f -name 'Statistics11ColabPythonIntroduction.mp4' -print -quit)"
          test -n "$VIDEO"
          test -s "$VIDEO"

      - name: Verify and stage delivery
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find render_workspace/media -type f -name 'Statistics11ColabPythonIntroduction.mp4' -print -quit)"
          mkdir -p delivery
          cp "$VIDEO" delivery/Statistics11ColabRealLayout_pqh.mp4
          cp render_workspace/main.py delivery/statistics11_colab_real_layout_masterclass.py
          cp preview_render.log preview_status.txt final_render.log final_status.txt source_sha256.txt delivery/
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -v "$PWD:/manim" -w /manim --entrypoint python manimcommunity/manim:v0.20.1 -c 'import av; from pathlib import Path; p=Path("delivery/Statistics11ColabRealLayout_pqh.mp4"); c=av.open(str(p)); s=c.streams.video[0]; codec=s.codec_context.name; pix=s.codec_context.pix_fmt; fps=float(s.average_rate); dur=float(c.duration/av.time_base); info=f"codec_name={codec}\nwidth={s.width}\nheight={s.height}\nr_frame_rate={fps:.6f}\npix_fmt={pix}\nduration={dur:.6f}\nsize={p.stat().st_size}\n"; Path("delivery/MEDIA_INFO.txt").write_text(info); assert codec=="h264" and s.width==1920 and s.height==1080 and abs(fps-30)<0.01 and pix=="yuv420p" and dur>1'
          printf '%s\n' 'manim -pqh main.py Statistics11ColabPythonIntroduction --format=mp4 --disable_caching' > delivery/render_command.txt
          sha256sum delivery/* > delivery/SHA256SUMS.txt
          cat delivery/MEDIA_INFO.txt
          ls -lh delivery

      - name: Upload verified delivery
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11ColabRealLayout_pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11ColabRealLayout_failure_diagnostics
          path: |
            render_workspace/main.py
            preview_render.log
            preview_status.txt
            final_render.log
            final_status.txt
            source_sha256.txt
          if-no-files-found: ignore
          retention-days: 2
