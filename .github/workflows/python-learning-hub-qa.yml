name: Python Learning Hub QA

# V14: split architecture + deep theory QA + proven Colab runtime + universal black terminal + literal STEP-by-STEP guidance for all stages.
on:
  pull_request:
    paths:
      - 'python/**'
      - 'index.html'
      - 'qa/check_python_hub_split_pages.py'
      - 'qa/check_python_hub_visual_v8.py'
      - 'qa/check_operations_visual_v9.py'
      - 'qa/check_workshop_colab_v11.py'
      - 'qa/check_workshop_terminal_v12.py'
      - 'qa/check_workshop_guidance_v13.py'
      - 'qa/check_workshop_guidance_v14.py'
      - 'qa/workshop_colab_smoke_v11.cjs'
      - 'actividad-colab-01/app.js'
      - 'supabase/migrations/*python_learning_hub*.sql'
      - '.github/workflows/python-learning-hub-qa.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'index.html'
      - 'qa/check_python_hub_split_pages.py'
      - 'qa/check_python_hub_visual_v8.py'
      - 'qa/check_operations_visual_v9.py'
      - 'qa/check_workshop_colab_v11.py'
      - 'qa/check_workshop_terminal_v12.py'
      - 'qa/check_workshop_guidance_v13.py'
      - 'qa/check_workshop_guidance_v14.py'
      - 'qa/workshop_colab_smoke_v11.cjs'
      - 'actividad-colab-01/app.js'
      - 'supabase/migrations/*python_learning_hub*.sql'
      - '.github/workflows/python-learning-hub-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check python/config-v2.js
          node --check python/course-data-v4.js
          node --check python/hub-router.js
          node --check python/theory-page.js
          node --check python/theory-visual-v8.js
          node --check python/theory-visual-v9.js
          node --check python/workshop-page.js
          node --check python/workshop-terminal-v12.js
          node --check python/workshop-guidance-v13.js
          node --check python/workshop-guidance-v14.js
          node --check qa/workshop_colab_smoke_v11.cjs
      - name: Static course contracts
        run: |
          python -m py_compile qa/check_python_hub_split_pages.py qa/check_python_hub_visual_v8.py qa/check_operations_visual_v9.py qa/check_workshop_colab_v11.py qa/check_workshop_terminal_v12.py qa/check_workshop_guidance_v13.py qa/check_workshop_guidance_v14.py
          python qa/check_python_hub_split_pages.py
          python qa/check_python_hub_visual_v8.py
          python qa/check_operations_visual_v9.py
          python qa/check_workshop_colab_v11.py
          python qa/check_workshop_terminal_v12.py
          python qa/check_workshop_guidance_v13.py
          python qa/check_workshop_guidance_v14.py
      - name: Verify production Pyodide asset
        run: curl --fail --silent --show-error --location --head https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js >/dev/null
      - name: Real proven Pyodide workshop smoke
        run: |
          npm install --no-save --no-package-lock pyodide@0.27.7
          node qa/workshop_colab_smoke_v11.cjs
