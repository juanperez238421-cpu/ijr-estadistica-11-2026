name: Python Learning Hub QA

# V10: split architecture + deep theory QA + real workshop Python runtime smoke.
on:
  pull_request:
    paths:
      - 'python/**'
      - 'index.html'
      - 'qa/check_python_hub_split_pages.py'
      - 'qa/check_python_hub_visual_v8.py'
      - 'qa/check_operations_visual_v9.py'
      - 'qa/check_workshop_runtime_v10.py'
      - 'qa/workshop_runtime_smoke_v10.cjs'
      - 'supabase/migrations/*python_learning_hub*.sql'
      - '.github/workflows/python-learning-hub-qa.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'index.html'
      - 'qa/check_python_hub_split_pages.py'
      - 'qa/check_python_hub_visual_v8.py'
      - 'qa/check_operations_visual_v9.py'
      - 'qa/check_workshop_runtime_v10.py'
      - 'qa/workshop_runtime_smoke_v10.cjs'
      - 'supabase/migrations/*python_learning_hub*.sql'
      - '.github/workflows/python-learning-hub-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check python/config-v2.js
          node --check python/course-data-v4.js
          node --check python/hub-router.js
          node --check python/theory-page.js
          node --check python/theory-visual-v8.js
          node --check python/theory-visual-v9.js
          node --check python/workshop-runtime-v10.js
          node --check python/workshop-page.js
          node --check qa/workshop_runtime_smoke_v10.cjs
      - name: Static course contracts
        run: |
          python -m py_compile qa/check_python_hub_split_pages.py qa/check_python_hub_visual_v8.py qa/check_operations_visual_v9.py qa/check_workshop_runtime_v10.py
          python qa/check_python_hub_split_pages.py
          python qa/check_python_hub_visual_v8.py
          python qa/check_operations_visual_v9.py
          python qa/check_workshop_runtime_v10.py
      - name: Verify production Pyodide asset
        run: curl --fail --silent --show-error --location --head https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js >/dev/null
      - name: Real Pyodide workshop smoke
        run: |
          npm install --no-save --no-package-lock pyodide@0.27.7
          node qa/workshop_runtime_smoke_v10.cjs
