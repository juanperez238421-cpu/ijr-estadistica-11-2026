name: Python Learning Hub QA

on:
  pull_request:
    paths:
      - 'python/**'
      - 'index.html'
      - 'qa/check_python_hub.py'
      - 'supabase/migrations/20260826133521_python_learning_hub_gated_progress_v2.sql'
      - '.github/workflows/python-learning-hub-qa.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'index.html'
      - 'qa/check_python_hub.py'
      - 'supabase/migrations/20260826133521_python_learning_hub_gated_progress_v2.sql'
      - '.github/workflows/python-learning-hub-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check python/gated-app.js
          node --check python/config-v2.js
      - name: Static course contract
        run: |
          python -m py_compile qa/check_python_hub.py
          python qa/check_python_hub.py
