name: Python Learning Hub V47 QA

# Current production contract: 16-topic curriculum, 12 workshop stages per topic,
# V42 runtime, V43 guided UI, V44 progression, V46 XLSX curriculum, and V47 Arrays guidance.
# Legacy pre-V42 split-page checks remain in the repository for historical regression work,
# but are no longer authoritative for the production workshop.html entry point.
on:
  pull_request:
    paths:
      - 'python/**'
      - 'qa/check_arrays_workshop_v37.cjs'
      - 'qa/check_workshop_v47_contract.cjs'
      - 'qa/arrays_workshop_v47_e2e.cjs'
      - 'qa/check_statistics11_xlsx_curriculum_v46.cjs'
      - 'qa/check_library_playground_v61.cjs'
      - 'supabase/migrations/*python_learning_hub*.sql'
      - 'supabase/migrations/*python_hub*.sql'
      - '.github/workflows/python-learning-hub-qa.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'qa/check_arrays_workshop_v37.cjs'
      - 'qa/check_workshop_v47_contract.cjs'
      - 'qa/arrays_workshop_v47_e2e.cjs'
      - 'qa/check_statistics11_xlsx_curriculum_v46.cjs'
      - 'qa/check_library_playground_v61.cjs'
      - 'supabase/migrations/*python_learning_hub*.sql'
      - 'supabase/migrations/*python_hub*.sql'
      - '.github/workflows/python-learning-hub-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-v47-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Current JavaScript syntax
        run: |
          node --check python/config-v2.js
          node --check python/course-data-v4.js
          node --check python/workshop-catalog-v27.js
          node --check python/data-analyst-extension-v30.js
          node --check python/workshop-array-prompts-v28.js
          node --check python/curriculum-data-first-v32.js
          node --check python/curriculum-xlsx-first-v46.js
          node --check python/workshop-v42.js
          node --check python/workshop-guidance-v43.js
          node --check python/workshop-progression-guard-v44.js
          node --check python/hub-router.js
          node --check python/library-playground-v61.js
          node --check qa/check_arrays_workshop_v37.cjs
          node --check qa/check_workshop_v47_contract.cjs
          node --check qa/check_statistics11_xlsx_curriculum_v46.cjs
          node --check qa/arrays_workshop_v47_e2e.cjs
          node --check qa/check_library_playground_v61.cjs

      - name: Current production course contracts
        run: |
          node qa/check_workshop_v47_contract.cjs
          node qa/check_arrays_workshop_v37.cjs
          node qa/check_statistics11_xlsx_curriculum_v46.cjs
          node qa/check_library_playground_v61.cjs

      - name: Verify production Pyodide asset
        run: curl --fail --silent --show-error --location --head https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js >/dev/null
