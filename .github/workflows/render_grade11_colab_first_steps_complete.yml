name: Render Grade 11 Colab First Steps Complete PQH

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout isolated render branch
        uses: actions/checkout@v4

      - name: Reconstruct dependencies and validate learning files
        shell: bash
        run: |
          set -euo pipefail
          WORK="render_jobs/grade11_colab_first_steps"
          OLD_REF="render/statistics11-colab-v2-interface-20260729"
          OLD_BASE="render_jobs/statistics11_colab_data_foundations"

          git fetch --depth=1 origin "$OLD_REF:refs/remotes/origin/$OLD_REF"
          mkdir -p "$WORK"

          for part in final_source_part_00.b64 final_source_part_01.b64 final_source_part_02.b64 final_source_part_03.b64; do
            git show "origin/$OLD_REF:$OLD_BASE/$part"
          done | base64 -d | gzip -dc > "$WORK/statistics11_colab_data_analysis_foundations.py"

          git show "origin/$OLD_REF:$OLD_BASE/dataset_part_00.b64" \
            | base64 -d | gzip -dc > "$WORK/grade11_colab_student_success.csv"

          cp materials/grade11_colab_first_steps/REVIEW_GRADE11_COLAB_INTERFACE_CURRENT.md "$WORK/"
          cp materials/grade11_colab_first_steps/README_RENDER_COLAB_FIRST_STEPS.md "$WORK/"

          cd "$WORK"
          python -m py_compile \
            statistics11_colab_data_analysis_foundations.py \
            grade11_colab_first_steps_complete.py

          echo "5828a630f0629b6177ffadda3fe3b45f2698c74bf2edb18c368646984b8599fc  statistics11_colab_data_analysis_foundations.py" | sha256sum -c -
          echo "9e290045435cefb82e798234eb19ceb120788ca49a70b8f9e7eaa3ad74a5497c  grade11_colab_student_success.csv" | sha256sum -c -

          python - <<'PY'
          import ast, csv, json
          from pathlib import Path

          source = Path('grade11_colab_first_steps_complete.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          classes = {node.name for node in tree.body if isinstance(node, ast.ClassDef)}
          assert {'Grade11ColabFirstStepsComplete', 'Grade11ColabFirstStepsCompletePreview'} <= classes
          assert 'scene_08_comments' in source
          assert 'scene_10_arithmetic_basics' in source
          assert 'scene_14_boolean_logic' in source
          assert 'scene_15_conditionals' in source
          assert 'scene_17_upload_csv_and_pandas' in source

          nb = json.loads(Path('Grade11_Colab_First_Steps.ipynb').read_text(encoding='utf-8'))
          assert nb['nbformat'] == 4 and len(nb['cells']) >= 25

          with open('grade11_colab_student_success.csv', newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 72 and len(rows[0]) == 13
          print('Source, notebook, and CSV validation: PASS')
          PY

          sha256sum \
            grade11_colab_first_steps_complete.py \
            Grade11_Colab_First_Steps.ipynb \
            REVIEW_GRADE11_COLAB_INTERFACE_CURRENT.md \
            README_RENDER_COLAB_FIRST_STEPS.md \
            > SOURCE_SHA256.txt

      - name: Pull fixed ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Mandatory critical-layout preview with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/grade11_colab_first_steps
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e COLAB_FIRST_STEPS_SHORT_PAUSES=1 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql grade11_colab_first_steps_complete.py \
                Grade11ColabFirstStepsCompletePreview \
                --format=mp4 --disable_caching
            ' 2>&1 | tee preview_pql.log

      - name: Complete class validation with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/grade11_colab_first_steps
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e COLAB_FIRST_STEPS_SHORT_PAUSES=1 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql grade11_colab_first_steps_complete.py \
                Grade11ColabFirstStepsComplete \
                --format=mp4 --disable_caching
            ' 2>&1 | tee complete_pql.log

      - name: Final full-duration render with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/grade11_colab_first_steps
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home -e COLAB_FIRST_STEPS_SHORT_PAUSES=0 \
            -v "$PWD:/manim" -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pqh grade11_colab_first_steps_complete.py \
                Grade11ColabFirstStepsComplete \
                --format=mp4 --disable_caching
            ' 2>&1 | tee final_pqh.log

      - name: Verify, decode, audit frames, and stage delivery
        shell: bash
        run: |
          set -euo pipefail
          cd render_jobs/grade11_colab_first_steps
          VIDEO="$(find media -type f -path '*/1080p30/*' -name 'Grade11ColabFirstStepsComplete.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO" && test -s "$VIDEO"
          mkdir -p delivery/control_frames
          ffprobe -v error -show_streams -show_format -of json "$VIDEO" > delivery/FFPROBE.json

          python - "$VIDEO" <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('delivery/FFPROBE.json').read_text(encoding='utf-8'))
          stream = next(s for s in data['streams'] if s.get('codec_type') == 'video')
          assert stream['codec_name'] == 'h264'
          assert int(stream['width']) == 1920 and int(stream['height']) == 1080
          assert stream['r_frame_rate'] == '30/1'
          assert stream['pix_fmt'] == 'yuv420p'
          assert float(data['format']['duration']) > 120
          assert int(data['format']['size']) > 1_000_000
          print('Technical media validation: PASS')
          PY

          ffmpeg -v error -i "$VIDEO" -f null -
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          python - "$VIDEO" "$DURATION" <<'PY'
          import subprocess, sys
          video, duration = sys.argv[1], float(sys.argv[2])
          times = list(range(8, int(duration), 12)) + [max(1.0, duration - 3)]
          for index, t in enumerate(times):
              subprocess.run([
                  'ffmpeg', '-y', '-v', 'error', '-ss', f'{t:.3f}', '-i', video,
                  '-frames:v', '1', f'delivery/control_frames/frame_{index:02d}_{t:.0f}s.png'
              ], check=True)
          PY

          cp "$VIDEO" delivery/Grade11ColabFirstStepsComplete_pqh.mp4
          cp grade11_colab_first_steps_complete.py delivery/
          cp statistics11_colab_data_analysis_foundations.py delivery/
          cp Grade11_Colab_First_Steps.ipynb delivery/
          cp grade11_colab_student_success.csv delivery/
          cp REVIEW_GRADE11_COLAB_INTERFACE_CURRENT.md delivery/
          cp README_RENDER_COLAB_FIRST_STEPS.md delivery/
          cp preview_pql.log complete_pql.log final_pqh.log delivery/
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Grade11ColabFirstStepsComplete
          ManimCE: 0.20.1
          Final command: manim -pqh grade11_colab_first_steps_complete.py Grade11ColabFirstStepsComplete --format=mp4 --disable_caching
          Resolution: 1920x1080 at 30 fps
          Language: English
          Lesson: interface, cell anatomy, comments, operations, Boolean logic, conditionals, debugging, CSV/Pandas, saving and sharing
          EOF
          sha256sum delivery/Grade11ColabFirstStepsComplete_pqh.mp4 \
            delivery/grade11_colab_first_steps_complete.py \
            delivery/statistics11_colab_data_analysis_foundations.py \
            delivery/Grade11_Colab_First_Steps.ipynb \
            delivery/grade11_colab_student_success.csv \
            > delivery/SHA256SUMS.txt

      - name: Upload verified delivery
        uses: actions/upload-artifact@v4
        with:
          name: Grade11ColabFirstStepsComplete_Final_pqh
          path: render_jobs/grade11_colab_first_steps/delivery/
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Grade11ColabFirstStepsComplete_failure
          path: |
            render_jobs/grade11_colab_first_steps/grade11_colab_first_steps_complete.py
            render_jobs/grade11_colab_first_steps/Grade11_Colab_First_Steps.ipynb
            render_jobs/grade11_colab_first_steps/preview_pql.log
            render_jobs/grade11_colab_first_steps/complete_pql.log
            render_jobs/grade11_colab_first_steps/final_pqh.log
            render_jobs/grade11_colab_first_steps/media/
            render_jobs/grade11_colab_first_steps/delivery/
          if-no-files-found: ignore
          retention-days: 2
