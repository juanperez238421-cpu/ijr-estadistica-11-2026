name: Deploy Supabase Backend

on:
  workflow_dispatch:
    inputs:
      open_assessment:
        description: "Open assessment only after bank, assignments and teacher readiness pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      IP_HASH_SALT: ${{ secrets.IP_HASH_SALT }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY IP_HASH_SALT SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name:-}" ]; then echo "Missing $name"; exit 1; fi
          done
          if [ ${#IP_HASH_SALT} -lt 24 ]; then echo "IP_HASH_SALT must be at least 24 characters"; exit 1; fi
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL must be an https://*.supabase.co URL"; exit 1;;
          esac

      - name: Setup Python dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push

      - name: Configure Edge Function secret
        run: supabase secrets set IP_HASH_SALT="$IP_HASH_SALT" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Functions
        run: |
          set -euo pipefail
          for fn in start-attempt submit-answer log-event finish-attempt teacher-action; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Deep backend readiness check
        run: |
          python tools/check_backend_readiness.py \
            --url "$SUPABASE_URL" \
            --service-role-key "$SUPABASE_SERVICE_ROLE_KEY" \
            --expected-status draft

      - name: Open assessment after full readiness validation
        if: ${{ inputs.open_assessment }}
        run: |
          python tools/open_assessment.py \
            --url "$SUPABASE_URL" \
            --service-role-key "$SUPABASE_SERVICE_ROLE_KEY"
