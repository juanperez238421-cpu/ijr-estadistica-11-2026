name: Deploy Supabase Backend

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'tools/check_backend_readiness.py'
      - 'tools/open_assessment.py'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:
    inputs:
      open_assessment:
        description: "Open assessment only after bank, roster, sources and teacher readiness pass"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required configuration
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL; do
            if [ -z "${!name:-}" ]; then echo "Missing $name"; exit 1; fi
          done
          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "SUPABASE_URL must be an https://*.supabase.co URL"; exit 1;;
          esac

      - name: Setup Python dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy teacher control function
        run: supabase functions deploy teacher-action --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deep backend readiness check
        run: |
          python tools/check_backend_readiness.py \
            --url "$SUPABASE_URL" \
            --service-role-key "$SUPABASE_SERVICE_ROLE_KEY"

      - name: Validate draft state before opening
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.open_assessment }}
        run: |
          python tools/check_backend_readiness.py \
            --url "$SUPABASE_URL" \
            --service-role-key "$SUPABASE_SERVICE_ROLE_KEY" \
            --expected-status draft \
            --require-teacher

      - name: Open assessment after full readiness validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.open_assessment }}
        run: |
          python tools/open_assessment.py \
            --url "$SUPABASE_URL" \
            --service-role-key "$SUPABASE_SERVICE_ROLE_KEY"
