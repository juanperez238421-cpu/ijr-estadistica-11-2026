name: Deploy Supabase Backend

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'tools/check_backend_readiness.py'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: statistics11-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_REF: rlfxnjbqxbozjdzkbwlz
      SUPABASE_URL: https://rlfxnjbqxbozjdzkbwlz.supabase.co
      SUPABASE_ANON_KEY: sb_publishable_rmVOQ3Orx49KpW_4uMqYew_c2HpcA87
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ASSESSMENT_EMAIL_FROM: ${{ secrets.ASSESSMENT_EMAIL_FROM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing database deployment secrets in Repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Production project: $SUPABASE_PROJECT_REF"

      - name: Setup Python dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply all pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --include-all

      - name: Configure transactional email secrets
        if: ${{ env.RESEND_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set RESEND_API_KEY="$RESEND_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"
          if [ -n "${ASSESSMENT_EMAIL_FROM:-}" ]; then
            supabase secrets set ASSESSMENT_EMAIL_FROM="$ASSESSMENT_EMAIL_FROM" --project-ref "$SUPABASE_PROJECT_REF"
          fi

      - name: Warn when email provider is not configured
        if: ${{ env.RESEND_API_KEY == '' }}
        run: |
          echo "::warning::RESEND_API_KEY is not configured. Reports will remain in the durable outbox until this secret is added."

      - name: Deploy transactional email Edge Function
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy send-assessment-email \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Deploy Seminar T3 static host Edge Function
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/functions/seminar-t3-host/index.ts
          supabase functions deploy seminar-t3-host \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --use-api

      - name: Wait for PostgREST and Edge runtime propagation
        run: sleep 8

      - name: Public production health check
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 6 --retry-delay 3 --retry-all-errors \
            -X POST "$SUPABASE_URL/rest/v1/rpc/statistics11_assessment_health" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' > /tmp/stat11_health.json

          cat /tmp/stat11_health.json

          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('/tmp/stat11_health.json').read_text())
          required={
              'ready':True,
              'status':'open',
              'student_rpc':True,
              'teacher_rpc':True,
              'email_capture_ready':True,
              'crypto_ready':True,
          }
          failures=[]
          for key,value in required.items():
              if payload.get(key) != value:
                  failures.append(f'{key}={payload.get(key)!r}, expected {value!r}')
          runtime=payload.get('runtime_smoke') or {}
          if runtime.get('ready') is not True:
              failures.append(f"runtime_smoke.ready={runtime.get('ready')!r}, expected True")
          if int(payload.get('question_count') or 0) < 2000:
              failures.append(f"question_count={payload.get('question_count')}, expected >= 2000")
          if int(payload.get('roster_count') or 0) < 61:
              failures.append(f"roster_count={payload.get('roster_count')}, expected >= 61")
          topics=payload.get('topic_counts') or {}
          for topic in ('FCP','P_SIMPLE','P_DIST','P_CIRC'):
              if int(topics.get(topic) or 0) < 500:
                  failures.append(f'{topic}={topics.get(topic)}, expected >= 500')
          if failures:
              raise SystemExit('BACKEND NOT READY:\n- ' + '\n- '.join(failures))
          print('Statistics 11 backend is READY for student traffic, email outbox and teacher analytics.')
          PY

      - name: Seminar T3 public host smoke test
        shell: bash
        run: |
          set -euo pipefail
          BASE="$SUPABASE_URL/functions/v1/seminar-t3-host"
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 3 --retry-all-errors \
            "$BASE/" > /tmp/seminar_student.html
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 3 --retry-all-errors \
            "$BASE/teacher.html" > /tmp/seminar_teacher.html
          curl --fail --silent --show-error --location \
            "$BASE/data/course-index.json" > /tmp/seminar_course.json
          grep -q "Third Period Coding Studio" /tmp/seminar_student.html
          grep -q "Registro" /tmp/seminar_teacher.html
          python -m json.tool /tmp/seminar_course.json >/dev/null
          echo "Student URL: $BASE/"
          echo "Teacher URL: $BASE/teacher.html"

      - name: Deep private readiness check
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: |
          python tools/check_backend_readiness.py \
            --url "$SUPABASE_URL" \
            --service-role-key "$SUPABASE_SERVICE_ROLE_KEY" \
            --expected-status open \
            --require-teacher

      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          echo "### Statistics 11 + Seminar T3 backend READY" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: \`$SUPABASE_PROJECT_REF\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Assessment: OPEN" >> "$GITHUB_STEP_SUMMARY"
          echo "- Questions: >= 2,000; >= 500 per topic" >> "$GITHUB_STEP_SUMMARY"
          echo "- Third integrity strike: terminal server-side finalization" >> "$GITHUB_STEP_SUMMARY"
          echo "- Email Edge Function: DEPLOYED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Seminar T3 static host: DEPLOYED + SMOKE TESTED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Student: $SUPABASE_URL/functions/v1/seminar-t3-host/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Teacher: $SUPABASE_URL/functions/v1/seminar-t3-host/teacher.html" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${RESEND_API_KEY:-}" ]; then
            echo "- Email provider: CONFIGURED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Email provider: PENDING RESEND_API_KEY" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Teacher analytics RPC: available" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgREST schema cache: refreshed" >> "$GITHUB_STEP_SUMMARY"

      - name: Report deployment status to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            label="❌ FAILED"
          elif [ -z "${RESEND_API_KEY:-}" ]; then
            label="⚠️ CORE READY · EMAIL PROVIDER PENDING · SEMINAR T3 HOST READY"
          else
            label="✅ READY · EMAIL ACTIVE · SEMINAR T3 HOST READY"
          fi
          gh issue comment 33 \
            --repo juanperez238421-cpu/ijr-estadistica-11-2026 \
            --body "$label · Deploy Supabase Backend · run $RUN_ID · commit $SHA · $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
