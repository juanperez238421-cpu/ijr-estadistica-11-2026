name: Render Statistics 11 Friendly Colab V4 PQH

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render_v4:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout isolated V4 render branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate standalone V4 source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee validation_v4.log) 2>&1

          # Reconstruct the previously validated base source. The connector
          # payload has a known gzip trailer error, so preserve the complete
          # decompressed bytes and accept them only after deterministic repair.
          set +e
          cat manim_render_jobs/statistics11_colab_friendly_v3/source_part_*.b64 \
            | base64 -d \
            | gzip -dc \
            > statistics11_colab_friendly_introduction_v3_base.py
          reconstruct_status=${PIPESTATUS[2]}
          set -e
          echo "gzip reconstruction status: ${reconstruct_status}"
          test -s statistics11_colab_friendly_introduction_v3_base.py

          sed -i \
            -e 's/diffepence/difference/g' \
            -e 's/pender/render/g' \
            statistics11_colab_friendly_introduction_v3_base.py

          # Make the shared Tex sanitizer portable for all body text.
          python - <<'PY'
          from pathlib import Path
          path = Path('statistics11_colab_friendly_introduction_v3_base.py')
          text = path.read_text(encoding='utf-8')
          old = "result = str(value).replace('–', '--').replace('—', '---')"
          new = "result = str(value).replace('–', '--').replace('—', '---').replace('…', '...').replace('≈', 'approximately').replace('×', 'x').replace('→', '->')"
          if old not in text:
              raise SystemExit('Expected sanitizer line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat manim_render_jobs/statistics11_colab_friendly_v4/overrides_part_*.b64 \
            | base64 -d \
            | gzip -dc \
            > statistics11_colab_friendly_v4_overrides.py
          echo "fcdaad3b189b6bc309ace629a0e52f5836464352546dcbdbfe67f5fa81aff7a3  statistics11_colab_friendly_v4_overrides.py" \
            | sha256sum -c -

          cp statistics11_colab_friendly_introduction_v3_base.py \
             statistics11_colab_friendly_introduction_v4.py
          tail -n +2 statistics11_colab_friendly_v4_overrides.py \
            >> statistics11_colab_friendly_introduction_v4.py

          python -m py_compile statistics11_colab_friendly_introduction_v4.py
          grep -Fq 'class Statistics11ColabFriendlyIntroductionV4(Statistics11ColabFriendlyIntroduction):' \
            statistics11_colab_friendly_introduction_v4.py
          grep -Fq 'class Statistics11ColabFriendlyIntroductionV4Preview(Statistics11ColabFriendlyIntroductionV4):' \
            statistics11_colab_friendly_introduction_v4.py
          sha256sum statistics11_colab_friendly_introduction_v4.py \
            | tee v4_source_sha256.txt

      - name: Pull fixed ManimCE image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Mandatory targeted preview with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=1 \
            -e STATS11_COLAB_SHOW_SOLUTIONS=0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql statistics11_colab_friendly_introduction_v4.py \
                Statistics11ColabFriendlyIntroductionV4Preview \
                --format=mp4 --disable_caching
            ' 2>&1 | tee preview_v4.log

      - name: Complete class validation with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=1 \
            -e STATS11_COLAB_SHOW_SOLUTIONS=0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql statistics11_colab_friendly_introduction_v4.py \
                Statistics11ColabFriendlyIntroductionV4 \
                --format=mp4 --disable_caching
            ' 2>&1 | tee complete_v4_pql.log

      - name: Final full-duration render with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=0 \
            -e STATS11_COLAB_SHOW_SOLUTIONS=0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pqh statistics11_colab_friendly_introduction_v4.py \
                Statistics11ColabFriendlyIntroductionV4 \
                --format=mp4 --disable_caching
            ' 2>&1 | tee final_v4_pqh.log

      - name: Verify media, decode, audit frames, and stage delivery
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find media -type f -path '*/1080p30/*' \
            -name 'Statistics11ColabFriendlyIntroductionV4.mp4' \
            -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$VIDEO"
          test -s "$VIDEO"

          mkdir -p delivery/control_frames
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of json "$VIDEO" | tee delivery/FFPROBE.json

          python - <<'PY'
          import json
          data = json.load(open('delivery/FFPROBE.json', encoding='utf-8'))
          stream = data['streams'][0]
          fmt = data['format']
          assert stream['codec_name'] == 'h264', stream
          assert int(stream['width']) == 1920, stream
          assert int(stream['height']) == 1080, stream
          assert stream['r_frame_rate'] == '30/1', stream
          assert stream['pix_fmt'] == 'yuv420p', stream
          assert float(fmt['duration']) > 60, fmt
          assert int(fmt['size']) > 1_000_000, fmt
          print('Technical media validation: PASS')
          PY

          ffmpeg -v error -i "$VIDEO" -f null -
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"
          MID="$(python -c "print(float('${DURATION}') / 2.0)")"
          ffmpeg -y -v error -ss 5 -i "$VIDEO" -frames:v 1 delivery/control_frames/start.png
          ffmpeg -y -v error -ss "$MID" -i "$VIDEO" -frames:v 1 delivery/control_frames/middle.png
          ffmpeg -y -v error -sseof -5 -i "$VIDEO" -frames:v 1 delivery/control_frames/end.png
          ffmpeg -y -v error -i "$VIDEO" \
            -vf "fps=1/30,scale=480:-1,tile=4x4:padding=6:margin=6" \
            -frames:v 1 delivery/control_frames/contact_sheet_30s.png
          test -s delivery/control_frames/start.png
          test -s delivery/control_frames/middle.png
          test -s delivery/control_frames/end.png
          test -s delivery/control_frames/contact_sheet_30s.png

          cp "$VIDEO" delivery/Statistics11ColabFriendlyIntroductionV4_pqh.mp4
          cp statistics11_colab_friendly_introduction_v4.py delivery/
          cp validation_v4.log preview_v4.log complete_v4_pql.log final_v4_pqh.log delivery/
          cat > delivery/RENDER_INFO.txt <<'EOF'
          Scene: Statistics11ColabFriendlyIntroductionV4
          Source: statistics11_colab_friendly_introduction_v4.py
          ManimCE: 0.20.1
          Final command: manim -pqh statistics11_colab_friendly_introduction_v4.py Statistics11ColabFriendlyIntroductionV4 --format=mp4 --disable_caching
          Edition: student, guided solution hidden
          EOF
          sha256sum delivery/Statistics11ColabFriendlyIntroductionV4_pqh.mp4 \
            delivery/statistics11_colab_friendly_introduction_v4.py \
            > delivery/SHA256SUMS.txt
          ls -lah delivery delivery/control_frames

      - name: Upload verified V4 delivery
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11ColabFriendlyIntroductionV4_pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7

      - name: Upload V4 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11ColabFriendlyIntroductionV4_failure
          path: |
            statistics11_colab_friendly_introduction_v4.py
            statistics11_colab_friendly_v4_overrides.py
            validation_v4.log
            preview_v4.log
            complete_v4_pql.log
            final_v4_pqh.log
            media/
          if-no-files-found: ignore
          retention-days: 2
