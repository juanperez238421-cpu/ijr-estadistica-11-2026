name: Statistics 11 Guided Colab Workshop V47 E2E

on:
  pull_request:
    paths:
      - 'python/workshop.html'
      - 'python/workshop-v42.js'
      - 'python/workshop-guidance-v43.css'
      - 'python/workshop-guidance-v43.js'
      - 'python/workshop-progression-guard-v44.css'
      - 'python/workshop-progression-guard-v44.js'
      - 'python/workshop-array-prompts-v28.js'
      - 'python/config-v2.js'
      - 'python/course-data-v4.js'
      - 'python/workshop-catalog-v27.js'
      - 'python/data-analyst-extension-v30.js'
      - 'python/curriculum-data-first-v32.js'
      - 'python/curriculum-xlsx-first-v46.js'
      - 'qa/check_arrays_workshop_v37.cjs'
      - 'qa/check_workshop_v47_contract.cjs'
      - 'qa/arrays_workshop_v47_e2e.cjs'
      - '.github/workflows/workshop-v42-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'python/workshop.html'
      - 'python/workshop-v42.js'
      - 'python/workshop-guidance-v43.css'
      - 'python/workshop-guidance-v43.js'
      - 'python/workshop-progression-guard-v44.css'
      - 'python/workshop-progression-guard-v44.js'
      - 'python/workshop-array-prompts-v28.js'
      - 'python/config-v2.js'
      - 'python/course-data-v4.js'
      - 'python/workshop-catalog-v27.js'
      - 'python/data-analyst-extension-v30.js'
      - 'python/curriculum-data-first-v32.js'
      - 'python/curriculum-xlsx-first-v46.js'
      - 'qa/check_arrays_workshop_v37.cjs'
      - 'qa/check_workshop_v47_contract.cjs'
      - 'qa/arrays_workshop_v47_e2e.cjs'
      - '.github/workflows/workshop-v42-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guided-colab-v47-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Current production syntax and contracts
        run: |
          node --check python/workshop-v42.js
          node --check python/workshop-array-prompts-v28.js
          node --check python/workshop-guidance-v43.js
          node --check python/workshop-progression-guard-v44.js
          node --check qa/check_arrays_workshop_v37.cjs
          node --check qa/check_workshop_v47_contract.cjs
          node --check qa/arrays_workshop_v47_e2e.cjs
          node qa/check_workshop_v47_contract.cjs
          node qa/check_arrays_workshop_v37.cjs

      - name: Install deterministic browser runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 pyodide@0.27.7
          npx playwright install --with-deps chromium

      - name: Arrays V47 full point-to-point Chromium smoke
        run: node qa/arrays_workshop_v47_e2e.cjs
