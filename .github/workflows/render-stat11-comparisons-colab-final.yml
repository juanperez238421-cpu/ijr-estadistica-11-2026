name: Render Statistics 11 Comparisons Colab FINAL PQH

on:
  push:
    branches:
      - manim/stat11-comparisons-colab-20260826
    paths:
      - 'manim/stat11_comparisons_colab/**'
      - '.github/workflows/render-stat11-comparisons-colab-final.yml'

permissions:
  contents: read

jobs:
  render_final:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_DIR: manim/stat11_comparisons_colab
      IMAGE: manimcommunity/manim:v0.20.1
      SCENE_FILE: src/stat11_comparisons_colab_final.py
      SCENE_CLASS: Stat11ComparisonsColabClassFinal

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Reconstruct style and validate exact source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p library delivery qa/audit_frames
          cat ../stat11_arrays_motivation/fragments/style_* > library/jp_classroom_style.py
          echo "14e1c5386b4d949ad022b8db4faac39ce92eb87b2554b18e08cc2292abb360ab  src/stat11_comparisons_colab.py" | sha256sum -c -
          echo "4ee896ff419963578dde2fd44f0ed1834a7e57089b07146f0cf3b1dd9c2110c3  src/stat11_comparisons_colab_final.py" | sha256sum -c -
          echo "3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d  library/jp_classroom_style.py" | sha256sum -c -
          python -m py_compile src/stat11_comparisons_colab.py src/stat11_comparisons_colab_final.py library/jp_classroom_style.py

      - name: Pull pinned ManimCE image
        run: docker pull "$IMAGE"

      - name: PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/media_pql"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w "/manim/$PROJECT_DIR" \
            "$IMAGE" \
            python -m manim -ql "$SCENE_FILE" "$SCENE_CLASS" \
            --format=mp4 --media_dir media_pql --disable_caching
          PREVIEW="$(find "$PROJECT_DIR/media_pql" -type f -name '*.mp4' ! -path '*/partial_movie_files/*' | head -n 1)"
          test -n "$PREVIEW"
          test -s "$PREVIEW"
          echo "PQL_OK=$PREVIEW"

      - name: PQH final render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/media_final"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w "/manim/$PROJECT_DIR" \
            "$IMAGE" \
            python -m manim -qh "$SCENE_FILE" "$SCENE_CLASS" \
            --fps 30 --format=mp4 --media_dir media_final --disable_caching
          FINAL="$(find "$PROJECT_DIR/media_final" -type f -name '*.mp4' ! -path '*/partial_movie_files/*' | head -n 1)"
          test -n "$FINAL"
          test -s "$FINAL"
          cp "$FINAL" "$PROJECT_DIR/delivery/Stat11_Comparisons_Colab_FINAL_PQH.mp4"

      - name: Install ffmpeg and verify final media
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          V="$PROJECT_DIR/delivery/Stat11_Comparisons_Colab_FINAL_PQH.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=nw=1 "$V" | tee "$PROJECT_DIR/qa/ffprobe.txt"
          grep -q '^codec_name=h264$' "$PROJECT_DIR/qa/ffprobe.txt"
          grep -q '^width=1920$' "$PROJECT_DIR/qa/ffprobe.txt"
          grep -q '^height=1080$' "$PROJECT_DIR/qa/ffprobe.txt"
          grep -q '^pix_fmt=yuv420p$' "$PROJECT_DIR/qa/ffprobe.txt"
          grep -q '^r_frame_rate=30/1$' "$PROJECT_DIR/qa/ffprobe.txt"
          ffmpeg -nostdin -v error -i "$V" -f null - 2> "$PROJECT_DIR/qa/decode_errors.log"
          test ! -s "$PROJECT_DIR/qa/decode_errors.log"
          sha256sum "$V" > "$PROJECT_DIR/qa/final_mp4.sha256"
          ffmpeg -nostdin -v error -i "$V" -vf "fps=1/18,scale=960:-2" -frames:v 18 "$PROJECT_DIR/qa/audit_frames/frame_%02d.jpg"
          test "$(find "$PROJECT_DIR/qa/audit_frames" -type f -name '*.jpg' | wc -l)" -ge 10

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: Stat11-Comparisons-Colab-FINAL-PQH
          retention-days: 30
          if-no-files-found: error
          path: manim/stat11_comparisons_colab/delivery/Stat11_Comparisons_Colab_FINAL_PQH.mp4

      - name: Upload QA metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stat11-Comparisons-Colab-FINAL-QA
          retention-days: 30
          if-no-files-found: warn
          path: |
            manim/stat11_comparisons_colab/qa/ffprobe.txt
            manim/stat11_comparisons_colab/qa/decode_errors.log
            manim/stat11_comparisons_colab/qa/final_mp4.sha256
            manim/stat11_comparisons_colab/qa/audit_frames/*.jpg
