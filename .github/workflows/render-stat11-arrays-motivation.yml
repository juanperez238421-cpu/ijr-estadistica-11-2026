name: Render Statistics 11 Arrays Motivation PQH

on:
  push:
    branches:
      - manim/stat11-arrays-motivation-20260826
    paths:
      - 'manim/stat11_arrays_motivation/**'
      - '.github/workflows/render-stat11-arrays-motivation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stat11-arrays-motivation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_DIR: manim/stat11_arrays_motivation
      IMAGE: manimcommunity/manim:v0.20.1

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Reconstruct and validate exact source
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p src library delivery qa
          cat fragments/scene_* > src/stat11_arrays_motivation.py
          cat fragments/style_* > library/jp_classroom_style.py
          sha256sum -c workflow/source_hashes.sha256
          python -m py_compile src/stat11_arrays_motivation.py library/jp_classroom_style.py workflow/validate_scene.py
          python workflow/validate_scene.py src/stat11_arrays_motivation.py

      - name: Pull pinned ManimCE image
        run: docker pull "$IMAGE"

      - name: PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/media_pql"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w "/manim/$PROJECT_DIR" \
            "$IMAGE" \
            python -m manim -ql src/stat11_arrays_motivation.py Stat11ArraysMotivation \
            --format=mp4 --media_dir media_pql --disable_caching
          PREVIEW="$(find "$PROJECT_DIR/media_pql" -type f -name '*.mp4' ! -path '*/partial_movie_files/*' | head -n 1)"
          test -n "$PREVIEW"
          test -s "$PREVIEW"
          echo "PQL_OK=$PREVIEW"

      - name: PQH final render
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/media_final"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w "/manim/$PROJECT_DIR" \
            "$IMAGE" \
            python -m manim -qh src/stat11_arrays_motivation.py Stat11ArraysMotivation \
            --fps 30 --format=mp4 --media_dir media_final --disable_caching
          FINAL="$(find "$PROJECT_DIR/media_final" -type f -name '*.mp4' ! -path '*/partial_movie_files/*' | head -n 1)"
          test -n "$FINAL"
          test -s "$FINAL"
          cp "$FINAL" "$PROJECT_DIR/delivery/Stat11ArraysMotivation_PQH.mp4"
          test -s "$PROJECT_DIR/delivery/Stat11ArraysMotivation_PQH.mp4"

      - name: Technical verification
        shell: bash
        run: |
          set -euo pipefail
          V="$PROJECT_DIR/delivery/Stat11ArraysMotivation_PQH.mp4"
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -of default=nw=1 "$V" | tee "$PROJECT_DIR/qa/ffprobe.txt"
          ffmpeg -nostdin -v error -i "$V" -f null - 2> "$PROJECT_DIR/qa/decode_errors.log"
          test ! -s "$PROJECT_DIR/qa/decode_errors.log"
          sha256sum "$V" > "$PROJECT_DIR/qa/final_mp4.sha256"

      - name: Upload verified MP4
        uses: actions/upload-artifact@v4
        with:
          name: Stat11-Arrays-Motivation-PQH
          retention-days: 30
          if-no-files-found: error
          path: |
            manim/stat11_arrays_motivation/delivery/Stat11ArraysMotivation_PQH.mp4
            manim/stat11_arrays_motivation/qa/ffprobe.txt
            manim/stat11_arrays_motivation/qa/final_mp4.sha256
