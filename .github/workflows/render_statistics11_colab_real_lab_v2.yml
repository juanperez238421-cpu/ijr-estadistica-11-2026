name: Render Statistics 11 Colab Real Lab V2

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout temporary render branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct, patch, and validate source and notebook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p render_workspace

          git fetch --no-tags --depth=1 origin \
            render/statistics11-colab-real-layout-20260727:refs/remotes/origin/render/statistics11-colab-real-layout-20260727

          git ls-tree -r --name-only refs/remotes/origin/render/statistics11-colab-real-layout-20260727 \
            | grep '^manim_render_jobs/statistics11_colab_real_layout_20260727/payload_.*\.b64$' \
            | sort \
            | while IFS= read -r payload; do
                git show "refs/remotes/origin/render/statistics11-colab-real-layout-20260727:${payload}"
              done \
            | base64 -d \
            | gzip -dc > render_workspace/base.py

          base64 -d < manim_render_jobs/statistics11_colab_real_lab_v2/statistics11_v2_overrides.py.gz.b64 \
            | gzip -dc > render_workspace/overrides.py

          python - <<'PY'
          from pathlib import Path

          source_path = Path('render_workspace/base.py')
          source = source_path.read_text(encoding='utf-8')

          old_comment = "# 6 is the total number of die outcomes"
          new_comment = "# Total number of die outcomes"
          if old_comment not in source:
              raise SystemExit('Expected original comments text was not found.')
          source = source.replace(old_comment, new_comment)

          old_title = """        title = Text(notebook_name, font=UI_FONT, font_size=20, color='#3C4043', weight=MEDIUM)\n        title.next_to(logo, RIGHT, buff=0.24)"""
          new_title = """        title = Text(notebook_name, font=UI_FONT, font_size=20, color='#3C4043', weight=MEDIUM)\n        # Keep long, real notebook filenames clear without colliding with Share/Gemini.\n        if title.width > min(6.15, width * 0.45):\n            title.scale_to_fit_width(min(6.15, width * 0.45))\n        title.next_to(logo, RIGHT, buff=0.24)"""
          if old_title not in source:
              raise SystemExit('Expected title block was not found.')
          source = source.replace(old_title, new_title, 1)

          overrides = Path('render_workspace/overrides.py').read_text(encoding='utf-8')
          source = source.rstrip() + '\n\n\n' + overrides.lstrip()
          source_path.with_name('main.py').write_text(source, encoding='utf-8')
          PY

          base64 -d < manim_render_jobs/statistics11_colab_real_lab_v2/Statistics11_Probability_Colab_Lab.ipynb.gz.b64 \
            | gzip -dc > render_workspace/Statistics11_Probability_Colab_Lab.ipynb

          python -m py_compile render_workspace/main.py
          python - <<'PY'
          import json
          from pathlib import Path

          nb_path = Path('render_workspace/Statistics11_Probability_Colab_Lab.ipynb')
          notebook = json.loads(nb_path.read_text(encoding='utf-8'))
          assert notebook['nbformat'] == 4
          cells = notebook['cells']
          assert len(cells) == 31
          code_cells = [cell for cell in cells if cell['cell_type'] == 'code']
          assert len(code_cells) == 18
          assert all(not any(output.get('output_type') == 'error' for output in cell.get('outputs', [])) for cell in code_cells)
          assert any('addition rule' in ''.join(cell.get('source', [])).lower() for cell in cells)
          assert any('conditional' in ''.join(cell.get('source', [])).lower() for cell in cells)
          PY

          SOURCE_SHA="$(sha256sum render_workspace/main.py | awk '{print $1}')"
          NOTEBOOK_SHA="$(sha256sum render_workspace/Statistics11_Probability_Colab_Lab.ipynb | awk '{print $1}')"
          echo "source_sha256=${SOURCE_SHA}" | tee source_sha256.txt
          echo "notebook_sha256=${NOTEBOOK_SHA}" | tee notebook_sha256.txt
          test "$SOURCE_SHA" = "1f4ca7010b49b1f6464cd94aa833698a41a7fe893a4b006c825950ad9c0f7013"
          test "$NOTEBOOK_SHA" = "95e8604bbcc021b1c724eb712af4d6b3755ed1140f4ec9a20a265c4fd7f4a569"
          grep -n '^class Statistics11ColabProbabilityMasterclassFinal' render_workspace/main.py

      - name: Pull official ManimCE 0.20.1 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Mandatory full preview with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=1 \
            -e STATS11_COLAB_SHOW_SOLUTIONS=0 \
            -v "$PWD:/manim" \
            -w /manim/render_workspace \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql main.py Statistics11ColabProbabilityMasterclassFinal \
                --format=mp4 \
                --disable_caching
            ' 2>&1 | tee preview_render.log
          status=${PIPESTATUS[0]}
          set -e
          echo "preview_container_exit_status=${status}" | tee preview_status.txt
          PREVIEW="$(find render_workspace/media -type f -name 'Statistics11ColabProbabilityMasterclassFinal.mp4' -print -quit)"
          test -n "$PREVIEW"
          test -s "$PREVIEW"
          cp "$PREVIEW" preview.mp4

      - name: Final render with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          rm -rf render_workspace/media
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=1 \
            -e STATS11_COLAB_SHOW_SOLUTIONS=0 \
            -v "$PWD:/manim" \
            -w /manim/render_workspace \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pqh main.py Statistics11ColabProbabilityMasterclassFinal \
                --format=mp4 \
                --disable_caching
            ' 2>&1 | tee final_render.log
          status=${PIPESTATUS[0]}
          set -e
          echo "final_container_exit_status=${status}" | tee final_status.txt
          VIDEO="$(find render_workspace/media -type f -name 'Statistics11ColabProbabilityMasterclassFinal.mp4' -print -quit)"
          test -n "$VIDEO"
          test -s "$VIDEO"

      - name: Verify and stage delivery with PyAV
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find render_workspace/media -type f -name 'Statistics11ColabProbabilityMasterclassFinal.mp4' -print -quit)"
          mkdir -p delivery
          cp "$VIDEO" delivery/Statistics11ColabProbabilityMasterclassFinal_pqh.mp4
          cp render_workspace/main.py delivery/statistics11_colab_real_layout_masterclass_v2.py
          cp render_workspace/Statistics11_Probability_Colab_Lab.ipynb delivery/
          cp preview_render.log preview_status.txt final_render.log final_status.txt source_sha256.txt notebook_sha256.txt delivery/

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint python \
            manimcommunity/manim:v0.20.1 \
            -c '
          import av
          from pathlib import Path
          p = Path("delivery/Statistics11ColabProbabilityMasterclassFinal_pqh.mp4")
          container = av.open(str(p))
          stream = container.streams.video[0]
          codec = stream.codec_context.name
          pix_fmt = stream.codec_context.pix_fmt
          fps = float(stream.average_rate)
          duration = float(container.duration / av.time_base)
          lines = [
              f"codec_name={codec}",
              f"width={stream.width}",
              f"height={stream.height}",
              f"r_frame_rate={fps:.6f}",
              f"pix_fmt={pix_fmt}",
              f"duration={duration:.6f}",
              f"size={p.stat().st_size}",
          ]
          Path("delivery/MEDIA_INFO.txt").write_text("\n".join(lines) + "\n")
          assert codec == "h264"
          assert stream.width == 1920
          assert stream.height == 1080
          assert abs(fps - 30.0) < 0.01
          assert pix_fmt == "yuv420p"
          assert duration > 1.0
          '

          cat > delivery/render_command.txt <<'EOF'
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e STATS11_COLAB_SHORT_PAUSES=1 -e STATS11_COLAB_SHOW_SOLUTIONS=0 -v "$PWD:/manim" -w /manim/render_workspace --entrypoint bash manimcommunity/manim:v0.20.1 -c 'mkdir -p /tmp/colab-bin; printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open; chmod +x /tmp/colab-bin/xdg-open; export PATH="/tmp/colab-bin:$PATH"; manim -pqh main.py Statistics11ColabProbabilityMasterclassFinal --format=mp4 --disable_caching'
          EOF

          sha256sum delivery/* > delivery/SHA256SUMS.txt
          cat delivery/MEDIA_INFO.txt
          ls -lh delivery

      - name: Upload verified delivery
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11ColabProbabilityMasterclassFinal_pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11ColabProbabilityMasterclassFinal_failure_diagnostics
          path: |
            render_workspace/main.py
            render_workspace/Statistics11_Probability_Colab_Lab.ipynb
            preview_render.log
            preview_status.txt
            final_render.log
            final_status.txt
            source_sha256.txt
            notebook_sha256.txt
          if-no-files-found: ignore
          retention-days: 2
