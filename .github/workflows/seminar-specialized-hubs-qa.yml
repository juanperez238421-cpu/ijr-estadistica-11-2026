name: Seminar Specialized Learning Hubs QA

on:
  push:
    branches: [main]
    paths:
      - "seminario-tracks/**"
      - "supabase/migrations/*seminar_specialized*"
      - "supabase/migrations/*seminar_diagnostic*"
      - "supabase/functions/seminar-studio-student/**"
      - "supabase/functions/seminar-diagnostic-practical/**"
      - ".github/workflows/seminar-specialized-hubs-qa.yml"
  pull_request:
    paths:
      - "seminario-tracks/**"
      - "supabase/migrations/*seminar_specialized*"
      - "supabase/migrations/*seminar_diagnostic*"
      - "supabase/functions/seminar-studio-student/**"
      - "supabase/functions/seminar-diagnostic-practical/**"
      - ".github/workflows/seminar-specialized-hubs-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate specialized route assets
        run: |
          set -euo pipefail
          for route in web data-science cybersecurity 3d-programming robotics; do
            f="seminario-tracks/$route/index.html"
            test -s "$f"
            grep -Fq "data-track=\"$route\"" "$f"
            grep -Fq 'config-v5.js' "$f"
            grep -Fq 'hub-v4.js' "$f"
            grep -Fq 'diagnostic-practical-v6.css' "$f"
            grep -Fq 'diagnostic-practical-v7.js' "$f"
            grep -Fq 'diagnostic-practical-backend-v6.js' "$f"
            grep -Fq 'topic-pages-v6.js' "$f"
          done
          for f in \
            seminario-tracks/shared/diagnostic-practical-v7.js \
            seminario-tracks/shared/diagnostic-practical-backend-v6.js \
            seminario-tracks/shared/diagnostic-practical-v6.css \
            seminario-tracks/shared/learning-content-v7.js \
            seminario-tracks/shared/learning-page-v7.js \
            seminario-tracks/shared/workshop-v7-integrity.js \
            supabase/functions/seminar-diagnostic-practical/index.ts \
            supabase/migrations/20260916163000_seminar_diagnostic_practical_v6.sql; do
            test -s "$f"
          done

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check seminario-tracks/shared/config-v5.js
          node --check seminario-tracks/shared/track-data.js
          node --check seminario-tracks/shared/hub-v4.js
          node --check seminario-tracks/shared/diagnostic-practical-v7.js
          node --check seminario-tracks/shared/diagnostic-practical-backend-v6.js
          node --check seminario-tracks/shared/topic-pages-v6.js
          node --check seminario-tracks/shared/learning-content-v7.js
          node --check seminario-tracks/shared/learning-page-v7.js
          node --check seminario-tracks/shared/workshop-v7-integrity.js

      - name: Validate curriculum and V7 learning contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          require('./seminario-tracks/shared/track-data.js');
          require('./seminario-tracks/shared/learning-content-v7.js');
          const tracks=globalThis.IJR_SPECIALIZED_TRACKS;
          const extra=globalThis.IJR_SPECIALIZED_V7_CONTENT;
          const slugs=['web','data-science','cybersecurity','3d-programming','robotics'];
          if(!tracks||Object.keys(tracks).length!==5) throw new Error('Expected five tracks');
          if(!extra||Object.keys(extra).length!==5) throw new Error('Expected V7 theory for five tracks');
          for(const slug of slugs){
            const t=tracks[slug];
            if(!t||t.sprints.length!==8||t.stages.length!==4) throw new Error(`${slug}: curriculum contract mismatch`);
            if(t.diagnostic.totalQuestions!==15||t.diagnostic.scoredQuestions!==12||t.diagnostic.selfProfileQuestions!==3) throw new Error(`${slug}: diagnostic contract mismatch`);
            for(const stage of t.stages){
              if(!stage.title||!stage.theory||!stage.lab||!stage.code||!stage.language) throw new Error(`${slug}/${stage.n}: base topic incomplete`);
              const e=extra[slug]?.[stage.n];
              if(!e||!e.why||e.objectives?.length<3||e.deep?.length<3||e.trace?.length<3||e.checkpoints?.length<3||!e.case||!e.workshop) throw new Error(`${slug}/${stage.n}: V7 theory incomplete`);
            }
          }
          NODE

      - name: Validate practical diagnostic terminal V7
        run: |
          set -euo pipefail
          js=seminario-tracks/shared/diagnostic-practical-v7.js
          bridge=seminario-tracks/shared/diagnostic-practical-backend-v6.js
          css=seminario-tracks/shared/diagnostic-practical-v6.css
          count=$(grep -o "id:'[A-Za-z0-9-]*'" "$js" | wc -l | tr -d ' ')
          test "$count" = "10"
          for token in \
            web-valid-age web-task-domain \
            data-iqr-fences data-pandas-filter \
            cyber-valid-code cyber-access-policy \
            3d-translate 3d-positive-dimension \
            robotics-threshold robotics-failsafe; do
            grep -Fq "$token" "$js"
          done
          grep -Fq 'loadPyodide' "$js"
          grep -Fq 'loadPackagesFromImports' "$js"
          grep -Fq "sandbox='allow-scripts'" "$js"
          grep -Fq "connect-src 'none'" "$js"
          grep -Fq 'Run tests' "$js"
          grep -Fq 'Both must be run before submission' "$js"
          grep -Fq 'const normalized=raw.replace' "$js"
          grep -Fq 'requestAnimationFrame' "$js"
          grep -Fq 'MutationObserver(scheduleEnhance)' "$js"
          grep -Fq 'const setText=' "$js"
          if grep -Fq 'queueMicrotask(enhance)' "$js"; then exit 1; fi
          grep -Fq 'seminar-diagnostic-practical' "$bridge"
          grep -Fq "body?.action==='diagnostic-practical'" "$bridge"
          grep -Fq 'terminal-editor-v6' "$css"
          grep -Fq 'practical-result-v6' "$css"
          if grep -Eq 'SUPABASE_SERVICE_ROLE_KEY|service_role' "$js" "$bridge"; then exit 1; fi

      - name: Validate Theory and Workshop V7 retained
        run: |
          set -euo pipefail
          grep -Fq 'One topic · two dedicated pages' seminario-tracks/shared/topic-pages-v6.js
          grep -Fq 'WHY THIS MATTERS' seminario-tracks/shared/learning-page-v7.js
          grep -Fq 'DEEP DIVE' seminario-tracks/shared/learning-page-v7.js
          grep -Fq 'CONCEPT CHECKPOINT' seminario-tracks/shared/learning-page-v7.js
          grep -Fq 'STEP 01 · PREDICT' seminario-tracks/shared/learning-page-v7.js
          grep -Fq 'STEP 03 · IMPLEMENT + RUN' seminario-tracks/shared/learning-page-v7.js
          grep -Fq 'STEP 06 · EXPLAIN' seminario-tracks/shared/learning-page-v7.js
          grep -Fq 'loadPyodide' seminario-tracks/shared/learning-page-v7.js
          grep -Fq 'workshop_completed' seminario-tracks/shared/learning-page-v7.js
          grep -Fq 'Code changed after the last successful run' seminario-tracks/shared/workshop-v7-integrity.js

      - name: Validate protected V5 diagnostic contract
        run: |
          set -euo pipefail
          cfg=seminario-tracks/shared/config-v5.js
          hub=seminario-tracks/shared/hub-v4.js
          grep -Fq "gatewayFunction:'seminar-studio-student'" "$cfg"
          grep -Fq "bankVersion:'2026-09-16-v5'" "$cfg"
          grep -Fq "gateway('diagnostic-start'" "$hub"
          grep -Fq "gateway('diagnostic-questions'" "$hub"
          grep -Fq "gateway('diagnostic-submit'" "$hub"
          grep -Fq 'answers:state.answers' "$hub"
          if grep -Fq 'correct_option' "$hub"; then exit 1; fi
          if grep -Fq 'seminar_track_diagnostic_submit' "$hub"; then exit 1; fi

      - name: Validate Supabase practical evidence contract
        run: |
          set -euo pipefail
          practical=supabase/migrations/20260916163000_seminar_diagnostic_practical_v6.sql
          fn=supabase/functions/seminar-diagnostic-practical/index.ts
          grep -Fq 'set prompt = replace(prompt' "$practical"
          grep -Fq 'PRACTICAL_RUN' "$practical"
          grep -Fq 'PRACTICAL_RUN' "$fn"
          grep -Fq 'access_token_hash' "$fn"
          grep -Fq 'attempt_already_completed' "$fn"
          grep -Fq 'challenge_id' "$fn"
          grep -Fq 'run_count' "$fn"
          if grep -Fq 'source_code' "$fn"; then exit 1; fi

          rpc=supabase/migrations/20260916154214_seminar_specialized_diagnostic_v5_rpcs.sql
          bank=supabase/migrations/20260916154716_seminar_specialized_diagnostic_v5_question_bank.sql
          grep -Fq 'stage-mastery-v5' "$rpc"
          grep -Fq 'revoke execute on function public.seminar_track_diagnostic_submit' "$rpc"
          grep -Fq 'service_role' "$rpc"
          grep -Fq '2026-09-16-v5' "$bank"
