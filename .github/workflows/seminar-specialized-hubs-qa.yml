name: Seminar Specialized Learning Hubs QA

on:
  push:
    branches: [main]
    paths:
      - "seminario-tracks/**"
      - "supabase/migrations/*seminar_specialized*"
      - "supabase/functions/seminar-studio-student/**"
      - ".github/workflows/seminar-specialized-hubs-qa.yml"
  pull_request:
    paths:
      - "seminario-tracks/**"
      - "supabase/migrations/*seminar_specialized*"
      - "supabase/functions/seminar-studio-student/**"
      - ".github/workflows/seminar-specialized-hubs-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate five dedicated routes and retained legacy assets
        run: |
          set -euo pipefail
          for route in web data-science cybersecurity 3d-programming robotics; do
            f="seminario-tracks/$route/index.html"
            test -s "$f"
            grep -q "data-track=\"$route\"" "$f"
            grep -q 'config-v5.js' "$f"
            grep -q 'hub-v4.js' "$f"
            grep -q 'topic-pages-v6.js' "$f"
            grep -q 'oop-parity-v6.css' "$f"
          done
          test -s seminario-tracks/index.html
          test -s seminario-tracks/theory.html
          test -s seminario-tracks/workshop.html
          test -s seminario-tracks/shared/styles.css
          test -s seminario-tracks/shared/config.js
          test -s seminario-tracks/shared/hub.js
          test -s seminario-tracks/shared/config-v5.js
          test -s seminario-tracks/shared/track-data.js
          test -s seminario-tracks/shared/hub-v4.js
          test -s seminario-tracks/shared/topic-pages-v5.js
          test -s seminario-tracks/shared/learning-page-v5.js
          test -s seminario-tracks/shared/senior-v5.css
          test -s seminario-tracks/shared/topic-pages-v6.js
          test -s seminario-tracks/shared/learning-page-v6.js
          test -s seminario-tracks/shared/oop-parity-v6.css

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          node --check seminario-tracks/shared/config.js
          node --check seminario-tracks/shared/hub.js
          node --check seminario-tracks/shared/config-v5.js
          node --check seminario-tracks/shared/track-data.js
          node --check seminario-tracks/shared/hub-v4.js
          node --check seminario-tracks/shared/topic-pages-v5.js
          node --check seminario-tracks/shared/learning-page-v5.js
          node --check seminario-tracks/shared/topic-pages-v6.js
          node --check seminario-tracks/shared/learning-page-v6.js

      - name: Validate curriculum contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          require('./seminario-tracks/shared/track-data.js');
          const tracks=globalThis.IJR_SPECIALIZED_TRACKS;
          const slugs=['web','data-science','cybersecurity','3d-programming','robotics'];
          if(!tracks||Object.keys(tracks).length!==5) throw new Error('Expected exactly five tracks');
          for(const slug of slugs){
            const t=tracks[slug];
            if(!t||t.sprints.length!==8) throw new Error(`${slug}: expected eight sprints`);
            if(!Array.isArray(t.stages)||t.stages.length!==4) throw new Error(`${slug}: expected four technical topics/stages`);
            if(t.diagnostic.totalQuestions!==15||t.diagnostic.scoredQuestions!==12||t.diagnostic.selfProfileQuestions!==3) throw new Error(`${slug}: diagnostic contract mismatch`);
            for(const stage of t.stages){
              if(!stage.title||!stage.theory||!stage.lab||!stage.code||!stage.language) throw new Error(`${slug} stage ${stage.n}: theory/workshop contract incomplete`);
            }
          }
          NODE

      - name: Validate OOP-parity specialized Theory and Workshop V6
        run: |
          set -euo pipefail
          grep -q 'One topic · two dedicated pages' seminario-tracks/shared/topic-pages-v6.js
          grep -q 'topic-card' seminario-tracks/shared/topic-pages-v6.js
          grep -q '>Theory<' seminario-tracks/shared/topic-pages-v6.js
          grep -q '>Workshop<' seminario-tracks/shared/topic-pages-v6.js
          grep -q 'QUICK REFERENCE · CURRENT CONTENT RETAINED' seminario-tracks/shared/topic-pages-v6.js
          grep -q '../seminario-oop-uml/styles.css' seminario-tracks/theory.html
          grep -q '../seminario-oop-uml/styles.css' seminario-tracks/workshop.html
          grep -q 'learning-page-v6.js' seminario-tracks/theory.html
          grep -q 'learning-page-v6.js' seminario-tracks/workshop.html
          grep -q '>Predict<' seminario-tracks/shared/learning-page-v6.js
          grep -q '>Model<' seminario-tracks/shared/learning-page-v6.js
          grep -q '>Implement<' seminario-tracks/shared/learning-page-v6.js
          grep -q '>Test<' seminario-tracks/shared/learning-page-v6.js
          grep -q '>Modify<' seminario-tracks/shared/learning-page-v6.js
          grep -q '>Explain<' seminario-tracks/shared/learning-page-v6.js
          grep -q 'evModel' seminario-tracks/shared/learning-page-v6.js
          grep -q 'evCode' seminario-tracks/shared/learning-page-v6.js
          grep -q 'evTest' seminario-tracks/shared/learning-page-v6.js
          grep -q 'evExplain' seminario-tracks/shared/learning-page-v6.js
          grep -q 'cybersecurity' seminario-tracks/shared/learning-page-v6.js
          grep -q 'Defensive security model' seminario-tracks/shared/learning-page-v6.js
          grep -q 'workshop_completed' seminario-tracks/shared/learning-page-v6.js
          grep -q 'prefers-reduced-motion' seminario-tracks/shared/oop-parity-v6.css

      - name: Validate V5 diagnostic security contract
        run: |
          set -euo pipefail
          cfg=seminario-tracks/shared/config-v5.js
          js=seminario-tracks/shared/hub-v4.js
          grep -q "gatewayFunction:'seminar-studio-student'" "$cfg"
          grep -q "bankVersion:'2026-09-16-v5'" "$cfg"
          grep -q 'p_answers' "$js"
          grep -qi 'self-profile' "$js"
          grep -q 'localStorage' "$js"
          grep -q 'aria-live' "$js"
          ! grep -q 'correct_option' "$js"
          ! grep -R -q 'SUPABASE_SERVICE_ROLE_KEY\|service_role' seminario-tracks/shared/config-v5.js seminario-tracks/shared/hub-v4.js seminario-tracks/shared/topic-pages-v6.js seminario-tracks/shared/learning-page-v6.js
          grep -q 'question-code-prompt' seminario-tracks/shared/diagnostic-v4.css

      - name: Validate Supabase V1 and V5 migration contracts
        run: |
          set -euo pipefail
          legacy=$(ls supabase/migrations/*seminar_specialized_learning_hubs_diagnostic_v1.sql | head -1)
          test -s "$legacy"
          grep -q 'seminar_track_diagnostic_questions' "$legacy"
          grep -q 'enable row level security' "$legacy"

          rpc=supabase/migrations/20260916154214_seminar_specialized_diagnostic_v5_rpcs.sql
          bank=supabase/migrations/20260916154716_seminar_specialized_diagnostic_v5_question_bank.sql
          test -s "$rpc"
          test -s "$bank"
          grep -q '2026-09-16-v5' "$rpc"
          grep -q 'stage-mastery-v5' "$rpc"
          grep -q 'revoke execute on function public.seminar_track_diagnostic_submit' "$rpc"
          grep -q 'grant execute on function public.seminar_track_diagnostic_submit' "$rpc"
          grep -q 'service_role' "$rpc"
          grep -q '2026-09-16-v5' "$bank"
          test "$(grep -o "concept_code='code_" "$bank" | wc -l)" -ge 20

          fn=supabase/functions/seminar-studio-student/index.ts
          test -s "$fn"
          grep -q '2026-09-16-v5' "$fn"
          grep -q 'learning-event' "$fn"
          grep -q 'workshop_completed' "$fn"
