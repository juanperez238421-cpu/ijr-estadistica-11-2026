name: Render Grade 11 Counting PQH

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'render_grade11_counting/**'
      - '.github/workflows/render_grade11_counting_pqh.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source and scene
        shell: bash
        run: |
          set -euo pipefail
          SRC='render_grade11_counting/statistics11_counting_visual_roadmap.py'
          test -s "$SRC"
          python -m py_compile "$SRC"
          grep -n '^class Statistics11CountingVisualRoadmap(MovingCameraScene)' "$SRC"
          if grep -nE '([A-Za-z]:\\|/Users/|/home/[^/]+/Desktop|/mnt/)' "$SRC"; then
            echo 'Absolute path detected.' >&2
            exit 1
          fi
          grep -n 'config.pixel_width = 1920' "$SRC"
          grep -n 'config.pixel_height = 1080' "$SRC"
          grep -n 'config.frame_rate = 30' "$SRC"

      - name: Pull official ManimCE image
        shell: bash
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Run mathematical validation
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim/render_grade11_counting \
            manimcommunity/manim:v0.20.1 \
            python -c "import statistics11_counting_visual_roadmap as m; print(m.validate_grade11_counting())" \
            | tee render_grade11_counting/math_validation.log

      - name: Preview render with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim/render_grade11_counting \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql statistics11_counting_visual_roadmap.py Statistics11CountingVisualRoadmap \
                --format=mp4 --disable_caching
            ' 2>&1 | tee render_grade11_counting/render_pql.log

      - name: Final render with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim/render_grade11_counting \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pqh statistics11_counting_visual_roadmap.py Statistics11CountingVisualRoadmap \
                --format=mp4 --disable_caching
            ' 2>&1 | tee render_grade11_counting/render_pqh.log

      - name: Normalize and verify final MP4
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ROOT='render_grade11_counting'
          RAW_VIDEO="$(find "$ROOT/media" -type f -name 'Statistics11CountingVisualRoadmap.mp4' -path '*1080p30*' -print -quit)"
          test -n "$RAW_VIDEO"
          test -s "$RAW_VIDEO"

          DELIVERY="$ROOT/delivery"
          FINAL_VIDEO="$DELIVERY/Statistics11_Counting_VisualRoadmap_1080p30.mp4"
          mkdir -p "$DELIVERY/control_frames"

          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$RAW_VIDEO" | tee "$DELIVERY/FFPROBE_RAW.txt"

          ffmpeg -y -v error -i "$RAW_VIDEO" \
            -map 0:v:0 -an \
            -vf 'scale=1920:1080:flags=lanczos,fps=30,format=yuv420p' \
            -c:v libx264 -preset medium -crf 17 \
            -profile:v high -level 4.1 \
            -movflags +faststart \
            "$FINAL_VIDEO"

          test -s "$FINAL_VIDEO"
          echo "video=$FINAL_VIDEO" >> "$GITHUB_OUTPUT"

          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$FINAL_VIDEO" | tee "$DELIVERY/FFPROBE.txt"

          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$FINAL_VIDEO")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$FINAL_VIDEO")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$FINAL_VIDEO")"
          fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$FINAL_VIDEO")"
          pix="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$FINAL_VIDEO")"
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$FINAL_VIDEO")"

          test "$codec" = 'h264'
          test "$width" = '1920'
          test "$height" = '1080'
          test "$fps" = '30/1'
          test "$pix" = 'yuv420p'

          midpoint="$(awk -v d="$duration" 'BEGIN { printf "%.3f", d/2 }')"
          ffmpeg -y -v error -ss 5 -i "$FINAL_VIDEO" -frames:v 1 "$DELIVERY/control_frames/frame_start.png"
          ffmpeg -y -v error -ss "$midpoint" -i "$FINAL_VIDEO" -frames:v 1 "$DELIVERY/control_frames/frame_middle.png"
          ffmpeg -y -v error -sseof -5 -i "$FINAL_VIDEO" -frames:v 1 "$DELIVERY/control_frames/frame_end.png"
          ffmpeg -v error -i "$FINAL_VIDEO" -f null -

      - name: Stage logs, source, metadata and hashes
        shell: bash
        run: |
          set -euo pipefail
          ROOT='render_grade11_counting'
          DELIVERY="$ROOT/delivery"
          cp "$ROOT/statistics11_counting_visual_roadmap.py" "$DELIVERY/"
          cp "$ROOT/render_pql.log" "$DELIVERY/"
          cp "$ROOT/render_pqh.log" "$DELIVERY/"
          cp "$ROOT/math_validation.log" "$DELIVERY/"
          cat > "$DELIVERY/RENDER_INFO.txt" <<'EOF'
          Scene: Statistics11CountingVisualRoadmap
          Source: statistics11_counting_visual_roadmap.py
          ManimCE: 0.20.1
          Preview command:
          manim -pql statistics11_counting_visual_roadmap.py Statistics11CountingVisualRoadmap --format=mp4 --disable_caching
          Final command:
          manim -pqh statistics11_counting_visual_roadmap.py Statistics11CountingVisualRoadmap --format=mp4 --disable_caching
          Delivery normalization:
          ffmpeg H.264 high profile, CRF 17, yuv420p, 1920x1080, 30 fps, faststart
          Validated target: 1920x1080, 30 fps, H.264, yuv420p
          EOF
          (
            cd "$DELIVERY"
            sha256sum \
              Statistics11_Counting_VisualRoadmap_1080p30.mp4 \
              statistics11_counting_visual_roadmap.py \
              render_pql.log render_pqh.log math_validation.log \
              FFPROBE_RAW.txt FFPROBE.txt RENDER_INFO.txt \
              control_frames/frame_start.png \
              control_frames/frame_middle.png \
              control_frames/frame_end.png \
              > SHA256SUMS.txt
          )

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11_Counting_VisualRoadmap_PQH
          path: render_grade11_counting/delivery/
          if-no-files-found: error
          retention-days: 7
