name: Render Grade 11 Counting PQH

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'render_grade11_counting/**'
      - '.github/workflows/render_grade11_counting_pqh.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source and scene
        shell: bash
        run: |
          set -euo pipefail
          SRC='render_grade11_counting/statistics11_counting_visual_roadmap.py'
          test -s "$SRC"
          python -m py_compile "$SRC"
          grep -n '^class Statistics11CountingVisualRoadmap(MovingCameraScene)' "$SRC"
          if grep -nE '([A-Za-z]:\\|/Users/|/home/[^/]+/Desktop|/mnt/)' "$SRC"; then
            echo 'Absolute path detected.' >&2
            exit 1
          fi
          grep -n 'config.pixel_width = 1920' "$SRC"
          grep -n 'config.pixel_height = 1080' "$SRC"
          grep -n 'config.frame_rate = 30' "$SRC"

      - name: Pull official ManimCE image
        shell: bash
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Run mathematical validation
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim/render_grade11_counting \
            manimcommunity/manim:v0.20.1 \
            python -c "import statistics11_counting_visual_roadmap as m; print(m.validate_grade11_counting())" \
            | tee render_grade11_counting/math_validation.log

      - name: Preview render with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim/render_grade11_counting \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql statistics11_counting_visual_roadmap.py Statistics11CountingVisualRoadmap \
                --format=mp4 --disable_caching
            ' 2>&1 | tee render_grade11_counting/render_pql.log

      - name: Final render with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim/render_grade11_counting \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pqh statistics11_counting_visual_roadmap.py Statistics11CountingVisualRoadmap \
                --format=mp4 --disable_caching
            ' 2>&1 | tee render_grade11_counting/render_pqh.log

      - name: Verify MP4 and extract control frames
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ROOT='render_grade11_counting'
          VIDEO="$(find "$ROOT/media" -type f -name 'Statistics11CountingVisualRoadmap.mp4' -path '*1080p30*' -print -quit)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"

          mkdir -p "$ROOT/delivery/control_frames"
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO" | tee "$ROOT/delivery/FFPROBE.txt"

          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$VIDEO")"
          width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO")"
          height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO")"
          fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$VIDEO")"
          pix="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of csv=p=0 "$VIDEO")"
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$VIDEO")"

          test "$codec" = 'h264'
          test "$width" = '1920'
          test "$height" = '1080'
          test "$fps" = '30/1'
          test "$pix" = 'yuv420p'

          midpoint="$(awk -v d="$duration" 'BEGIN { printf "%.3f", d/2 }')"
          ffmpeg -y -v error -ss 5 -i "$VIDEO" -frames:v 1 "$ROOT/delivery/control_frames/frame_start.png"
          ffmpeg -y -v error -ss "$midpoint" -i "$VIDEO" -frames:v 1 "$ROOT/delivery/control_frames/frame_middle.png"
          ffmpeg -y -v error -sseof -5 -i "$VIDEO" -frames:v 1 "$ROOT/delivery/control_frames/frame_end.png"
          ffmpeg -v error -i "$VIDEO" -f null -

      - name: Stage delivery and hashes
        shell: bash
        run: |
          set -euo pipefail
          ROOT='render_grade11_counting'
          VIDEO='${{ steps.verify.outputs.video }}'
          mkdir -p "$ROOT/delivery"
          cp "$VIDEO" "$ROOT/delivery/Statistics11_Counting_VisualRoadmap_1080p30.mp4"
          cp "$ROOT/statistics11_counting_visual_roadmap.py" "$ROOT/delivery/"
          cp "$ROOT/render_pql.log" "$ROOT/delivery/"
          cp "$ROOT/render_pqh.log" "$ROOT/delivery/"
          cp "$ROOT/math_validation.log" "$ROOT/delivery/"
          cat > "$ROOT/delivery/RENDER_INFO.txt" <<'EOF'
          Scene: Statistics11CountingVisualRoadmap
          Source: statistics11_counting_visual_roadmap.py
          ManimCE: 0.20.1
          Preview command:
          manim -pql statistics11_counting_visual_roadmap.py Statistics11CountingVisualRoadmap --format=mp4 --disable_caching
          Final command:
          manim -pqh statistics11_counting_visual_roadmap.py Statistics11CountingVisualRoadmap --format=mp4 --disable_caching
          Target: 1920x1080, 30 fps, H.264, yuv420p
          EOF
          (
            cd "$ROOT/delivery"
            sha256sum Statistics11_Counting_VisualRoadmap_1080p30.mp4 statistics11_counting_visual_roadmap.py render_pql.log render_pqh.log math_validation.log FFPROBE.txt > SHA256SUMS.txt
          )

      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11_Counting_VisualRoadmap_PQH
          path: render_grade11_counting/delivery/
          if-no-files-found: error
          retention-days: 7
