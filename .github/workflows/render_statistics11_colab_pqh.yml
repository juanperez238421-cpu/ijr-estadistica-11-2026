name: Render Statistics 11 Colab PQH

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout temporary render branch
        uses: actions/checkout@v4

      - name: Reconstruct, revise, and validate Python source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p render_workspace
          base64 -d < manim_render_jobs/statistics11_colab_20260727/payload_compact.py.gz.b64 | gzip -dc > render_workspace/main.py
          python - <<'PY'
          from pathlib import Path
          path = Path('render_workspace/main.py')
          source = path.read_text(encoding='utf-8')
          replacements = {
              "self.focus_camera(VGroup(multiplication_group, highlight_mul), min_width=3.3, max_width=4.5, hold=P_EXPLAIN)":
              "self.focus_camera(VGroup(row_1, highlight_mul), min_width=6.3, max_width=7.3, padding_x=0.72, hold=P_EXPLAIN)",
              "self.focus_camera(VGroup(parentheses_group, highlight_parentheses), min_width=3.7, max_width=5.2, hold=P_EXPLAIN)":
              "self.focus_camera(VGroup(row_2, highlight_parentheses), min_width=6.8, max_width=7.8, padding_x=0.72, hold=P_EXPLAIN)",
          }
          for old, new in replacements.items():
              if old not in source:
                  raise RuntimeError(f'Expected senior-review target not found: {old}')
              source = source.replace(old, new, 1)
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile render_workspace/main.py
          test -s render_workspace/main.py
          sha256sum render_workspace/main.py | tee source_sha256.txt
          grep -nE '^class Statistics11ColabPythonIntroduction' render_workspace/main.py
          grep -n 'focus_camera(VGroup(row_[12]' render_workspace/main.py

      - name: Pull official ManimCE 0.20.1 image
        shell: bash
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Mandatory preview render with literal -pql
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=1 \
            -e STATS11_COLAB_SHOW_SOLUTIONS=0 \
            -v "$PWD:/manim" \
            -w /manim/render_workspace \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql main.py Statistics11ColabPythonIntroductionPreview --format=mp4 --disable_caching
            ' 2>&1 | tee preview_render.log
          status=${PIPESTATUS[0]}
          set -e
          echo "Preview container exit status: $status"
          PREVIEW="$(find render_workspace/media -type f -name 'Statistics11ColabPythonIntroductionPreview.mp4' -print -quit)"
          test -n "$PREVIEW"
          test -s "$PREVIEW"
          stat -c 'size=%s' "$PREVIEW" | tee preview_ffprobe.txt

      - name: Final render with literal -pqh
        shell: bash
        run: |
          set -euo pipefail
          rm -rf render_workspace/media
          set +e
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e STATS11_COLAB_SHORT_PAUSES=1 \
            -e STATS11_COLAB_SHOW_SOLUTIONS=0 \
            -v "$PWD:/manim" \
            -w /manim/render_workspace \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pqh main.py Statistics11ColabPythonIntroduction --format=mp4 --disable_caching
            ' 2>&1 | tee final_render.log
          status=${PIPESTATUS[0]}
          set -e
          echo "Final container exit status: $status" | tee final_render_status.txt
          VIDEO="$(find render_workspace/media -type f -name 'Statistics11ColabPythonIntroduction.mp4' -print -quit)"
          test -n "$VIDEO"
          test -s "$VIDEO"

      - name: Verify and stage delivery
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find render_workspace/media -type f -name 'Statistics11ColabPythonIntroduction.mp4' -print -quit)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          mkdir -p delivery
          cp "$VIDEO" delivery/Statistics11ColabPythonIntroduction_pqh.mp4
          cp render_workspace/main.py delivery/statistics11_colab_python_intro_masterclass_senior_render_source.py
          cp preview_render.log preview_ffprobe.txt final_render.log final_render_status.txt source_sha256.txt delivery/
          cat > delivery/render_command.txt <<'EOF'
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e STATS11_COLAB_SHORT_PAUSES=1 -e STATS11_COLAB_SHOW_SOLUTIONS=0 -v "$PWD:/manim" -w /manim/render_workspace --entrypoint bash manimcommunity/manim:v0.20.1 -c 'mkdir -p /tmp/colab-bin; printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open; chmod +x /tmp/colab-bin/xdg-open; export PATH="/tmp/colab-bin:$PATH"; manim -pqh main.py Statistics11ColabPythonIntroduction --format=mp4 --disable_caching'
          EOF
          docker run --rm \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint python \
            manimcommunity/manim:v0.20.1 \
            -c 'import av, os; p="delivery/Statistics11ColabPythonIntroduction_pqh.mp4"; c=av.open(p); s=c.streams.video[0]; cc=s.codec_context; print(f"codec_name={cc.name}"); print(f"width={cc.width}"); print(f"height={cc.height}"); print(f"pix_fmt={cc.pix_fmt}"); print(f"r_frame_rate={s.average_rate}"); print(f"duration={float(c.duration/av.time_base):.6f}"); print(f"size={os.path.getsize(p)}")' \
            | tee delivery/FFPROBE.txt
          grep -q '^codec_name=h264$' delivery/FFPROBE.txt
          grep -q '^width=1920$' delivery/FFPROBE.txt
          grep -q '^height=1080$' delivery/FFPROBE.txt
          grep -q '^pix_fmt=yuv420p$' delivery/FFPROBE.txt
          sha256sum delivery/* > delivery/SHA256SUMS.txt
          ls -lh delivery
          echo "video=delivery/Statistics11ColabPythonIntroduction_pqh.mp4" >> "$GITHUB_OUTPUT"

      - name: Upload verified render artifact
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11ColabPythonIntroduction_pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11_render_failure_diagnostics
          path: |
            preview_render.log
            preview_ffprobe.txt
            final_render.log
            final_render_status.txt
          if-no-files-found: ignore
          retention-days: 2
