name: Statistics 11 Colab 9-PC Health

on:
  workflow_run:
    workflows: ["Deploy Statistics 11 Assessment"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: statistics11-colab-nine-pc-health
  cancel-in-progress: true

jobs:
  nine-pc-health:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      LAB_URL: https://juanperez238421-cpu.github.io/ijr-estadistica-11-2026/actividad-colab-01/
      MASTER_URL: https://juanperez238421-cpu.github.io/ijr-estadistica-11-2026/maestro/
    steps:
      - name: Checkout deployed branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Static syntax, curriculum and classroom asset gate
        run: |
          set -euo pipefail
          node --check actividad-colab-01/app.js
          node --check actividad-colab-01/resilience-v7.js
          node --check actividad-colab-01/sw-v7.js
          node --check actividad-colab-01/config.js
          node --check maestro/app.js
          node --check maestro/config.js
          python qa/check_colab_lab_v8.py
          test -s actividad-colab-01/data.csv
          grep -q "resilience-v7.js" actividad-colab-01/index.html
          grep -q "networkBadge" actividad-colab-01/index.html
          grep -q "39 GUIDED MIN" actividad-colab-01/index.html
          grep -q "liveStatus" maestro/index.html
          grep -q "Última respuesta" maestro/index.html

      - name: Nine simultaneous student page checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ijr-nine-pc && mkdir -p /tmp/ijr-nine-pc
          pids=()
          for pc in $(seq 1 9); do
            (
              set -euo pipefail
              curl --fail --silent --show-error --retry 2 --retry-delay 1 --connect-timeout 6 --max-time 25 \
                "${LAB_URL}?health=${GITHUB_RUN_ID}-${pc}" -o "/tmp/ijr-nine-pc/pc-${pc}.html"
              grep -q "Python Basics" "/tmp/ijr-nine-pc/pc-${pc}.html"
              grep -q "39 GUIDED MIN" "/tmp/ijr-nine-pc/pc-${pc}.html"
              curl --fail --silent --show-error --retry 2 --connect-timeout 6 --max-time 20 \
                "${LAB_URL}data.csv?health=${GITHUB_RUN_ID}-${pc}" -o "/tmp/ijr-nine-pc/pc-${pc}.csv"
              test -s "/tmp/ijr-nine-pc/pc-${pc}.csv"
              echo "PC${pc}=PASS"
            ) > "/tmp/ijr-nine-pc/pc-${pc}.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then failed=1; fi
          done
          cat /tmp/ijr-nine-pc/pc-*.log
          test "$failed" -eq 0

      - name: Teacher panel and shared CDN checks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --connect-timeout 6 --max-time 20 "$MASTER_URL" -o /tmp/master.html
          grep -q "Live Gradebook" /tmp/master.html
          pids=()
          for pc in $(seq 1 9); do
            (
              curl --fail --silent --show-error --retry 2 --connect-timeout 6 --max-time 20 \
                "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js" -o "/tmp/pyodide-${pc}.js"
              test -s "/tmp/pyodide-${pc}.js"
            ) &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then failed=1; fi
          done
          test "$failed" -eq 0

      - name: Supabase public RPC endpoint reachability
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL="$(sed -n "s/.*supabaseUrl: '\([^']*\)'.*/\1/p" actividad-colab-01/config.js | head -1)"
          SUPABASE_KEY="$(sed -n "s/.*supabaseAnonKey: '\([^']*\)'.*/\1/p" actividad-colab-01/config.js | head -1)"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
          pids=()
          for pc in $(seq 1 9); do
            (
              code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 6 --max-time 20 \
                -X OPTIONS \
                -H "apikey: $SUPABASE_KEY" \
                -H "Authorization: Bearer $SUPABASE_KEY" \
                "$SUPABASE_URL/rest/v1/rpc/student_learning_activity_start_team")"
              case "$code" in 200|204) ;; *) echo "PC${pc} Supabase OPTIONS HTTP $code"; exit 1;; esac
            ) &
            pids+=("$!")
          done
          failed=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then failed=1; fi
          done
          test "$failed" -eq 0

      - name: Publish health summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            label='✅ COLAB 9-PC + V8 CURRICULUM QA PASS'
          else
            label='❌ COLAB 9-PC + V8 CURRICULUM QA FAIL'
          fi
          gh issue comment 33 \
            --repo juanperez238421-cpu/ijr-estadistica-11-2026 \
            --body "$label · 39-min curriculum + student Pages x9 + Pyodide CDN x9 + Supabase reachability x9 + master panel · run $RUN_ID · commit $SHA · $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Upload nine-PC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: statistics11-colab-nine-pc-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: /tmp/ijr-nine-pc/
