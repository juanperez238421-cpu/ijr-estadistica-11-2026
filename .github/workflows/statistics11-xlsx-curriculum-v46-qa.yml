name: Statistics 11 XLSX Curriculum V46 QA

on:
  pull_request:
    paths:
      - 'python/**'
      - 'qa/check_statistics11_xlsx_curriculum_v46.cjs'
      - 'supabase/migrations/20260916170000_statistics11_xlsx_after_arrays_v46.sql'
      - '.github/workflows/statistics11-xlsx-curriculum-v46-qa.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'qa/check_statistics11_xlsx_curriculum_v46.cjs'
      - 'supabase/migrations/20260916170000_statistics11_xlsx_after_arrays_v46.sql'
      - '.github/workflows/statistics11-xlsx-curriculum-v46-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curriculum-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check python/curriculum-xlsx-first-v46.js
          node --check python/workshop-xlsx-topic-v46.js
          node --check qa/check_statistics11_xlsx_curriculum_v46.cjs
      - name: Curriculum and workshop contract
        run: node qa/check_statistics11_xlsx_curriculum_v46.cjs
