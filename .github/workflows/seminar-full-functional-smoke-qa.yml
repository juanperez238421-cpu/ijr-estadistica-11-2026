name: Seminar Full Functional Smoke QA

on:
  push:
    branches: [main]
    paths:
      - "seminario-tracks/**"
      - "seminario-oop-uml/**"
      - "seminario-oop-colab-01/**"
      - "qa/seminar/**"
      - "supabase/migrations/*seminar_specialized*"
      - ".github/workflows/seminar-full-functional-smoke-qa.yml"
  pull_request:
    paths:
      - "seminario-tracks/**"
      - "seminario-oop-uml/**"
      - "seminario-oop-colab-01/**"
      - "qa/seminar/**"
      - "supabase/migrations/*seminar_specialized*"
      - ".github/workflows/seminar-full-functional-smoke-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-and-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static syntax checks
        run: |
          set -euo pipefail
          node --check qa/seminar/content-audit.mjs
          node --check qa/seminar/browser-smoke.mjs
          node --check seminario-tracks/shared/config.js
          node --check seminario-tracks/shared/track-data.js
          node --check seminario-tracks/shared/hub.js
          node --check seminario-oop-uml/course-data.js
          node --check seminario-oop-uml/coding-labs-v2.js
          node --check seminario-oop-uml/coding-runtime-v2.js

      - name: Senior curriculum + code-cell audit
        run: node qa/seminar/content-audit.mjs

      - name: Validate QA-v2 database contract in repository
        run: |
          set -euo pipefail
          f=supabase/migrations/20260831190025_seminar_specialized_diagnostic_qa_v2.sql
          test -s "$f"
          grep -q "2026-08-31-v2" "$f"
          grep -q "seminar_track_diag_correct_option_valid" "$f"
          grep -q "((q.position - 1) % 4)::smallint" "$f"
          grep -q "greatest(jsonb_array_length(q.options)-1,1)" "$f"
          grep -Eq "set search_path[[:space:]]*=[[:space:]]*''" "$f"
          test -s qa/seminar/supabase-smoke.sql
          grep -q "rollback;" qa/seminar/supabase-smoke.sql
          grep -q "SEMINAR_SMOKE_OK" qa/seminar/supabase-smoke.sql

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/seminar-http.log 2>&1 &
          echo $! > /tmp/seminar-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/seminario-tracks/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/seminar-http.log
          exit 1

      - name: Full browser + live read-only Supabase smoke
        env:
          QA_BASE_URL: http://127.0.0.1:4173/
        run: node qa/seminar/browser-smoke.mjs

      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/seminar-http.pid ]; then kill "$(cat /tmp/seminar-http.pid)" 2>/dev/null || true; fi
          tail -n 80 /tmp/seminar-http.log 2>/dev/null || true
