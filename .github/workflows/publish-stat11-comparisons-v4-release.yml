name: Publish Statistics 11 Comparisons V4 MP4 Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-stat11-comparisons-v4-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_ID: '9617765857'
      TAG: stat11-comparisons-v4
      ASSET_NAME: Stat11_Comparisons_V4_FINAL_PQH.mp4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified V4 PQH artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          VIDEO="$(find artifact -type f -name '*.mp4' | head -n 1)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          cp "$VIDEO" "$ASSET_NAME"
          test "$(stat -c%s "$ASSET_NAME")" -gt 1000000

      - name: Publish permanent GitHub Release download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_NAME" --clobber
          else
            gh release create "$TAG" "$ASSET_NAME" \
              --title 'Statistics 11 Comparisons V4 FINAL PQH' \
              --notes 'Senior-reviewed ManimCE 0.20.1 classroom render. 1920x1080, 30 fps, H.264, yuv420p.' \
              --target "$GITHUB_SHA"
          fi

      - name: Verify release asset URL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets,url
