name: Statistics 11 Colab V8 Curriculum QA

on:
  pull_request:
    paths:
      - 'actividad-colab-01/**'
      - 'qa/check_colab_lab_v8.py'
      - 'supabase/migrations/20260819223500_colab_v8_python_basics_40min.sql'
      - '.github/workflows/colab-v8-curriculum-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statistics11-colab-v8-curriculum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curriculum-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check actividad-colab-01/app.js
          node --check actividad-colab-01/config.js
          node --check actividad-colab-01/resilience-v7.js
          node --check actividad-colab-01/sw-v7.js

      - name: Python curriculum and answer QA
        run: |
          set -euo pipefail
          python -m py_compile qa/check_colab_lab_v8.py
          python qa/check_colab_lab_v8.py

      - name: Static classroom contract
        run: |
          set -euo pipefail
          grep -q '39 GUIDED MIN' actividad-colab-01/index.html
          grep -q 'Python Basics' actividad-colab-01/index.html
          grep -q 'resilience-v7.js' actividad-colab-01/index.html
          grep -q 'targetMinutes: 40' actividad-colab-01/config.js
          grep -q 'requireFullscreen: false' actividad-colab-01/config.js
          test -s actividad-colab-01/colab_01_fundamentos.ipynb
          test -s actividad-colab-01/data.csv
