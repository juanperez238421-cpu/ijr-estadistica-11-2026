name: Statistics 11 Student Lab Access V65

on:
  pull_request:
    paths:
      - 'python/index.html'
      - 'python/hub-router.js'
      - 'python/supabase-rpc-facade-v65.js'
      - 'python/workshop-v42.js'
      - 'python/workshop-startup-v50.js'
      - 'python/config-v2.js'
      - 'qa/check_qa_student_v36.cjs'
      - '.github/workflows/qa-student-v36.yml'
  push:
    branches: [main]
    paths:
      - 'python/index.html'
      - 'python/hub-router.js'
      - 'python/supabase-rpc-facade-v65.js'
      - 'python/workshop-v42.js'
      - 'python/workshop-startup-v50.js'
      - 'python/config-v2.js'
      - 'qa/check_qa_student_v36.cjs'
      - '.github/workflows/qa-student-v36.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-lab-access:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check python/hub-router.js
          node --check python/supabase-rpc-facade-v65.js
          node --check python/workshop-v42.js
          node --check python/workshop-startup-v50.js
          node --check qa/check_qa_student_v36.cjs
      - name: Current student lab access contract
        run: node qa/check_qa_student_v36.cjs
