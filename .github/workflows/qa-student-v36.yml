name: QA Student V36

on:
  pull_request:
    paths:
      - 'python/index.html'
      - 'python/hub-router-v36.js'
      - 'python/theory-page.js'
      - 'python/workshop-page.js'
      - 'python/config-v2.js'
      - 'qa/check_qa_student_v36.cjs'
      - '.github/workflows/qa-student-v36.yml'
  push:
    branches: [main]
    paths:
      - 'python/index.html'
      - 'python/hub-router-v36.js'
      - 'qa/check_qa_student_v36.cjs'
      - '.github/workflows/qa-student-v36.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-student:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check python/hub-router-v36.js
          node --check qa/check_qa_student_v36.cjs
      - name: Student login contract
        run: node qa/check_qa_student_v36.cjs
