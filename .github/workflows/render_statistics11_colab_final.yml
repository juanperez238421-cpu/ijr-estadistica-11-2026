name: Render Final Statistics 11 Colab Lab

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Execute validated render pipeline
        shell: bash
        run: |
          set -euo pipefail
          cat manim_render_jobs/statistics11_colab_real_lab_v2/render_pipeline_*.b64 | base64 -d | gzip -dc > render_pipeline.sh
          set +e
          bash -x render_pipeline.sh > pipeline_debug.log 2>&1
          status=$?
          set -e
          tail -n 200 pipeline_debug.log
          exit "$status"
      - name: Upload verified delivery
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11ColabProbabilityMasterclassFinal_pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Statistics11ColabProbabilityMasterclassFinal_failure_diagnostics
          path: |
            pipeline_debug.log
            render_pipeline.sh
            render_workspace/
            preview_render.log
            preview_render_status.txt
            final_render.log
            final_render_status.txt
            source_sha256.txt
            notebook_sha256.txt
          if-no-files-found: ignore
          retention-days: 2
